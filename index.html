  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }

    /* ── 다크 모드 (기본) ── */
    :root {
      --bg: #0f1117;
      --surface: #1a1d27;
      --surface2: #222535;
      --border: #2e3148;
      --primary: #5b6af0;
      --primary-light: #7b8af5;
      --up: #ff5757;
      --down: #3db9ff;
      --text: #e8eaf6;
      --text2: #8b8fa8;
      --text3: #5c6080;
      --new: #f0a040;
      --ongoing: #50c96e;
      --closed: #8b8fa8;
      --badge-new: rgba(240,160,64,0.15);
      --badge-ongoing: rgba(80,201,110,0.15);
      --badge-closed: rgba(139,143,168,0.12);
    }

    /* ── 라이트 모드 ── */
    [data-theme="light"] {
      --bg: #f4f6fb;
      --surface: #ffffff;
      --surface2: #eef1f8;
      --border: #dde1ee;
      --primary: #4a58e0;
      --primary-light: #6270e8;
      --up: #e03535;
      --down: #1e9fd4;
      --text: #13172e;
      --text2: #4a5068;
      --text3: #8690a8;
      --new: #d47c10;
      --ongoing: #27a84e;
      --closed: #7a8099;
      --badge-new: rgba(212,124,16,0.12);
      --badge-ongoing: rgba(39,168,78,0.12);
      --badge-closed: rgba(122,128,153,0.1);
    }

    /* 테마 전환 트랜지션 */
    *, *::before, *::after {
      transition: background-color 0.25s ease, border-color 0.25s ease, color 0.2s ease;
    }

    body {
      background: var(--bg);
      color: var(--text);
      font-family: 'Apple SD Gothic Neo', 'Noto Sans KR', -apple-system, sans-serif;
      min-height: 100vh;
    }

    header {
      background: var(--surface);
      border-bottom: 1px solid var(--border);
      padding: 0 24px;
      position: sticky;
      top: 0;
      z-index: 100;
    }

    .header-inner {
      max-width: 1200px;
      margin: 0 auto;
      display: flex;
      align-items: center;
      justify-content: space-between;
      height: 60px;
    }

    .logo {
      display: flex;
      align-items: center;
      gap: 10px;
      font-size: 18px;
      font-weight: 700;
    }

    .logo-icon {
      width: 32px; height: 32px;
      border-radius: 8px;
      overflow: hidden;
      display: flex; align-items: center; justify-content: center;
    }

    .header-right {
      display: flex;
      align-items: center;
      gap: 16px;
      font-size: 12px;
    }

    .live-dot {
      display: flex; align-items: center; gap: 6px;
      color: var(--ongoing); font-size: 12px;
    }

    .live-dot::before {
      content: '';
      width: 7px; height: 7px;
      background: var(--ongoing);
      border-radius: 50%;
      animation: pulse 1.5s infinite;
    }

    @keyframes pulse {
      0%,100% { opacity:1; transform:scale(1); }
      50% { opacity:0.5; transform:scale(1.3); }
    }

    .source-badge {
      font-size: 11px; color: var(--text3);
      background: var(--surface2);
      border: 1px solid var(--border);
      border-radius: 4px;
      padding: 3px 8px;
    }

    .update-time { font-size: 11px; color: var(--text3); }

    /* ── 테마 토글 ── */
    .theme-toggle {
      position: relative;
      width: 52px; height: 28px;
      cursor: pointer; flex-shrink: 0;
    }

    .theme-toggle input {
      opacity: 0; width: 0; height: 0; position: absolute;
    }

    .toggle-track {
      position: absolute; inset: 0;
      background: var(--surface2);
      border: 1px solid var(--border);
      border-radius: 14px;
      transition: background 0.25s, border-color 0.25s;
      display: flex; align-items: center;
      padding: 0 4px;
      justify-content: space-between;
    }

    .toggle-icon { font-size: 12px; line-height: 1; pointer-events: none; }

    .toggle-thumb {
      position: absolute;
      width: 20px; height: 20px;
      background: var(--primary);
      border-radius: 50%;
      top: 3px; left: 4px;
      transition: transform 0.25s cubic-bezier(.4,0,.2,1), background 0.25s;
      box-shadow: 0 1px 4px rgba(0,0,0,0.3);
    }

    .theme-toggle input:checked ~ .toggle-thumb {
      transform: translateX(24px);
    }

    [data-theme="light"] .toggle-track {
      background: #e8edf8;
      border-color: #c8d0e8;
    }

    /* Summary */
    .summary-bar {
      background: var(--surface);
      border-bottom: 1px solid var(--border);
      padding: 12px 24px;
    }

    .summary-inner {
      max-width: 1200px; margin: 0 auto;
      display: flex; gap: 24px; flex-wrap: wrap; align-items: center;
    }

    .summary-card { display: flex; flex-direction: column; gap: 2px; }
    .summary-label { font-size: 11px; color: var(--text3); letter-spacing: 0.05em; }
    .summary-value { font-size: 20px; font-weight: 700; }
    .summary-value.up { color: var(--up); }
    .summary-value.ongoing { color: var(--ongoing); }
    .summary-value.new-clr { color: var(--new); }
    .summary-divider { width: 1px; background: var(--border); align-self: stretch; }

    /* Tabs */
    .tabs-wrap {
      max-width: 1200px; margin: 24px auto 0; padding: 0 24px;
    }

    .tabs {
      display: flex; gap: 4px;
      background: var(--surface); border-radius: 12px;
      padding: 4px; width: fit-content;
      border: 1px solid var(--border);
    }

    .tab {
      padding: 8px 20px; border-radius: 9px;
      font-size: 14px; font-weight: 600;
      cursor: pointer; transition: all 0.2s;
      color: var(--text2); border: none; background: none;
      display: flex; align-items: center; gap: 7px;
    }

    .tab .cnt {
      font-size: 11px; padding: 1px 7px; border-radius: 20px;
    }

    .tab.active { background: var(--primary); color: #fff; }
    .tab.active .cnt { background: rgba(255,255,255,0.2); color: #fff; }
    .tab:not(.active):hover { background: var(--surface2); color: var(--text); }
    .tab.t-ongoing .cnt { background: var(--badge-ongoing); color: var(--ongoing); }
    .tab.t-new .cnt { background: var(--badge-new); color: var(--new); }
    .tab.t-closed .cnt { background: var(--badge-closed); color: var(--closed); }

    /* Filter */
    .filter-bar {
      max-width: 1200px; margin: 16px auto 0; padding: 0 24px;
      display: flex; align-items: center; justify-content: space-between;
      flex-wrap: wrap; gap: 12px;
    }

    .filter-left { display: flex; align-items: center; gap: 8px; }

    .search-box {
      display: flex; align-items: center; gap: 8px;
      background: var(--surface); border: 1px solid var(--border);
      border-radius: 8px; padding: 7px 12px;
    }

    .search-box input {
      background: none; border: none; outline: none;
      color: var(--text); font-size: 13px; width: 160px;
    }

    .search-box input::placeholder { color: var(--text3); }

    .sort-select {
      background: var(--surface); border: 1px solid var(--border);
      border-radius: 8px; padding: 7px 10px;
      font-size: 13px; color: var(--text2); cursor: pointer; outline: none;
    }

    .filter-right { font-size: 12px; color: var(--text3); }

    /* Table */
    .table-wrap {
      max-width: 1200px; margin: 16px auto 60px; padding: 0 24px;
    }

    .ipo-table { width: 100%; border-collapse: collapse; }
    .ipo-table thead tr { border-bottom: 1px solid var(--border); }
    .ipo-table thead th {
      padding: 10px 16px; font-size: 11px; font-weight: 600;
      color: var(--text3); text-align: left; letter-spacing: 0.05em;
      text-transform: uppercase;
    }
    .ipo-table thead th.right { text-align: right; }
    .ipo-table tbody tr {
      border-bottom: 1px solid var(--border);
      transition: background 0.15s; cursor: pointer;
    }
    .ipo-table tbody tr:hover { background: var(--surface); }
    .ipo-table tbody tr:last-child { border-bottom: none; }
    .ipo-table tbody td { padding: 14px 16px; font-size: 13px; vertical-align: middle; }
    .ipo-table tbody td.right { text-align: right; }

    .company-cell { display: flex; align-items: center; gap: 12px; }
    .company-logo {
      width: 36px; height: 36px; border-radius: 8px;
      background: var(--surface2); border: 1px solid var(--border);
      display: flex; align-items: center; justify-content: center;
      font-size: 13px; font-weight: 700; color: var(--primary-light); flex-shrink: 0;
    }
    .company-name { font-size: 14px; font-weight: 600; }
    .company-sector { font-size: 11px; color: var(--text3); margin-top: 1px; }

    .status-badge {
      display: inline-flex; align-items: center; gap: 5px;
      padding: 3px 9px; border-radius: 20px;
      font-size: 11px; font-weight: 600;
    }
    .status-badge::before {
      content: ''; width: 5px; height: 5px; border-radius: 50%; background: currentColor;
    }
    .status-badge.ongoing { background: var(--badge-ongoing); color: var(--ongoing); }
    .status-badge.new { background: var(--badge-new); color: var(--new); }
    .status-badge.closed { background: var(--badge-closed); color: var(--closed); }
    .status-badge.ongoing::before { animation: pulse 1.5s infinite; }

    .rate-cell { min-width: 180px; }
    .rate-header { display: flex; justify-content: space-between; margin-bottom: 5px; }
    .rate-value { font-size: 15px; font-weight: 700; }
    .rate-value.hot { color: var(--up); }
    .rate-value.warm { color: var(--new); }
    .rate-value.cool { color: var(--down); }
    .rate-value.na { color: var(--text3); }

    .rate-bar-bg { height: 4px; background: var(--border); border-radius: 2px; }
    .rate-bar-fill { height: 100%; border-radius: 2px; transition: width 0.8s cubic-bezier(.4,0,.2,1); }
    .rate-bar-fill.hot { background: linear-gradient(90deg,#ff9090,var(--up)); }
    .rate-bar-fill.warm { background: linear-gradient(90deg,#f5c570,var(--new)); }
    .rate-bar-fill.cool { background: linear-gradient(90deg,#7dcfef,var(--down)); }
    .rate-bar-fill.na { background: var(--border); }

    .price-range { font-size: 12px; color: var(--text3); }
    .offer-price { font-size: 14px; font-weight: 600; }
    .date-range { font-size: 12px; color: var(--text2); white-space: nowrap; }
    .date-sub { font-size: 11px; color: var(--text3); margin-top: 2px; }

    .dday {
      display: inline-block; padding: 2px 8px;
      border-radius: 4px; font-size: 11px; font-weight: 700;
    }
    .dday.today { background: rgba(255,87,87,0.15); color: var(--up); }
    .dday.soon { background: rgba(91,106,240,0.15); color: var(--primary-light); }
    .dday.over { background: var(--badge-closed); color: var(--closed); }

    .exchange { font-size: 11px; padding: 2px 7px; border-radius: 4px; font-weight: 600; }
    .exchange.kospi { background: rgba(91,106,240,0.15); color: var(--primary-light); }
    .exchange.kosdaq { background: rgba(80,201,110,0.12); color: var(--ongoing); }

    .underwriter { font-size: 12px; color: var(--text2); }

    .tab-panel { display: none; }
    .tab-panel.active { display: block; }

    /* Loading */
    .loading-wrap {
      display: flex; flex-direction: column; align-items: center;
      justify-content: center; padding: 80px 0; gap: 16px;
    }

    .spinner {
      width: 36px; height: 36px; border-radius: 50%;
      border: 3px solid var(--border);
      border-top-color: var(--primary);
      animation: spin 0.8s linear infinite;
    }

    @keyframes spin { to { transform: rotate(360deg); } }

    .loading-text { font-size: 14px; color: var(--text3); }

    .empty-state { text-align: center; padding: 80px 0; color: var(--text3); }
    .empty-state .icon { font-size: 40px; margin-bottom: 12px; }
    .empty-state p { font-size: 14px; }

    /* ── 진행중 없을 때 빈 화면 ── */
    .no-ongoing {
      padding: 32px 0 48px;
    }

    /* 카운트다운 카드 (진행중 카드와 동일 구조) */
    .countdown-card {
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: 16px;
      overflow: hidden;
      position: relative;
      margin-bottom: 16px;
    }
    .countdown-card::before {
      content: '';
      position: absolute;
      top: 0; left: 0; right: 0;
      height: 3px;
      background: linear-gradient(90deg, var(--primary), var(--primary-light));
    }
    .countdown-glow {
      position: absolute;
      top: -60px; right: -60px;
      width: 200px; height: 200px;
      background: radial-gradient(circle, rgba(91,106,240,0.12) 0%, transparent 70%);
      pointer-events: none;
    }
    /* 헤더 */
    .cd-header {
      display: flex; align-items: center; gap: 12px;
      padding: 16px 18px 12px;
    }
    .cd-logo {
      width: 42px; height: 42px;
      background: linear-gradient(135deg, var(--primary), var(--primary-light));
      border-radius: 10px;
      display: flex; align-items: center; justify-content: center;
      font-size: 14px; font-weight: 800; color: #fff; flex-shrink: 0;
    }
    .cd-info { flex: 1; min-width: 0; }
    .cd-name { font-size: 16px; font-weight: 700; margin-bottom: 4px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
    .cd-badges { display: flex; align-items: center; gap: 6px; font-size: 12px; color: var(--text3); }
    .cd-soon-tag {
      padding: 4px 10px; border-radius: 20px; font-size: 12px; font-weight: 700;
      background: rgba(91,106,240,0.15); color: var(--primary-light);
      white-space: nowrap; flex-shrink: 0;
      animation: pulse-badge 2s infinite;
    }
    /* 2열 바디 */
    .cd-body {
      display: grid;
      grid-template-columns: 1fr 1fr;
      border-top: 1px solid var(--border);
    }
    /* 좌: 카운트다운 */
    .cd-timer-section {
      padding: 18px 18px 16px;
      background: var(--surface2);
      border-right: 1px solid var(--border);
      display: flex; flex-direction: column; justify-content: center;
    }
    .cd-timer-label {
      font-size: 11px; color: var(--text3); font-weight: 600;
      text-transform: uppercase; letter-spacing: 0.5px;
      margin-bottom: 14px;
      display: flex; align-items: center; gap: 6px;
    }
    .cd-timer-dot {
      width: 6px; height: 6px;
      background: var(--primary-light);
      border-radius: 50%;
      animation: pulse 2s infinite;
    }
    .cd-boxes {
      display: flex; gap: 8px; align-items: center;
    }
    .cd-box {
      display: flex; flex-direction: column; align-items: center;
      background: var(--surface); border: 1px solid var(--border);
      border-radius: 10px; padding: 10px 14px; min-width: 58px;
      flex: 1;
    }
    .cd-num {
      font-size: 26px; font-weight: 800;
      color: var(--text); line-height: 1;
      font-variant-numeric: tabular-nums;
      font-feature-settings: "tnum";
    }
    .cd-num.highlight { color: var(--primary-light); }
    .cd-label {
      font-size: 10px; color: var(--text3);
      margin-top: 4px; letter-spacing: 0.05em;
    }
    .cd-sep { font-size: 20px; font-weight: 700; color: var(--text3); flex-shrink: 0; }
    /* 우: 기본 정보 */
    .cd-stats-section {
      display: grid;
      grid-template-columns: 1fr 1px 1fr 1px 1fr;
      padding: 14px 18px;
      align-content: center;
    }
    /* 하단: detail 정보 */
    .cd-detail-section {
      border-top: 1px solid var(--border);
      padding: 14px 18px;
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 0;
    }
    .cd-detail-item {
      text-align: center; padding: 0 8px;
      border-right: 1px solid var(--border);
    }
    .cd-detail-item:last-child { border-right: none; }
    .cd-detail-label {
      font-size: 10px; color: var(--text3); text-transform: uppercase;
      letter-spacing: 0.4px; margin-bottom: 5px;
    }
    .cd-detail-value {
      font-size: 14px; font-weight: 700;
    }
    .cd-detail-sub { font-size: 10px; color: var(--text3); margin-top: 2px; }
    .cd-detail-loading { font-size: 12px; color: var(--text3); text-align: center; padding: 8px 0; }

      .cd-body { grid-template-columns: 1fr; }
      .cd-timer-section { border-right: none; border-bottom: 1px solid var(--border); }
      .cd-detail-section { grid-template-columns: 1fr 1px 1fr; }
      .cd-detail-item:last-child { display: none; }
    }

    .cd-sep {
      font-size: 28px; font-weight: 300; color: var(--border);
      align-self: center; padding-bottom: 4px;
    }

    /* 최근 마감 카드 */

      font-size: 13px; font-weight: 600; color: var(--text3);
      text-transform: uppercase; letter-spacing: 0.08em;
      margin-bottom: 14px;
      display: flex; align-items: center; gap: 8px;
    }

    .recent-section-title::after {
      content: '';
      flex: 1; height: 1px; background: var(--border);
    }

    .recent-cards {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(200px, 1fr));
      gap: 12px;
    }

    .recent-card {
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: 12px;
      padding: 16px;
      transition: border-color 0.2s, transform 0.2s;
      cursor: default;
    }

    .recent-card:hover {
      border-color: var(--primary);
      transform: translateY(-2px);
    }

    .rc-header {
      display: flex; align-items: center; justify-content: space-between;
      margin-bottom: 10px;
    }

    .rc-name {
      font-size: 13px; font-weight: 700;
      white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
      max-width: 120px;
    }

    .rc-rate {
      font-size: 18px; font-weight: 800; margin-bottom: 2px;
    }

    .rc-rate.hot { color: var(--up); }
    .rc-rate.warm { color: var(--new); }
    .rc-rate.cool { color: var(--down); }

    .rc-bar-bg {
      height: 3px; background: var(--border); border-radius: 2px; margin-bottom: 8px;
    }

    .rc-bar-fill {
      height: 100%; border-radius: 2px;
    }

    .rc-bar-fill.hot { background: linear-gradient(90deg,#ff9090,var(--up)); }
    .rc-bar-fill.warm { background: linear-gradient(90deg,#f5c570,var(--new)); }
    .rc-bar-fill.cool { background: linear-gradient(90deg,#7dcfef,var(--down)); }

    .rc-meta { font-size: 11px; color: var(--text3); }
    .rc-price { font-size: 12px; color: var(--text2); margin-top: 2px; font-weight: 600; }

    /* ── 수익률 섹션 ── */
    .returns-section { margin-top: 32px; }

    .ret-table { width: 100%; border-collapse: collapse; }

    .ret-table thead tr { border-bottom: 1px solid var(--border); }
    .ret-table thead th {
      padding: 10px 16px; font-size: 11px; font-weight: 600;
      color: var(--text3); text-align: left; letter-spacing: 0.05em; text-transform: uppercase;
    }
    .ret-table thead th.right { text-align: right; }

    .ret-table tbody tr {
      border-bottom: 1px solid var(--border);
      cursor: pointer; transition: background 0.15s;
    }
    .ret-table tbody tr:last-child { border-bottom: none; }
    .ret-table tbody tr:hover { background: var(--surface); }
    .ret-table tbody tr:hover .company-name { color: var(--primary-light); }

    .ret-table tbody td { padding: 13px 16px; font-size: 13px; vertical-align: middle; }
    .ret-table tbody td.right { text-align: right; }

    .ret-badge {
      display: inline-flex; align-items: center; gap: 3px;
      padding: 4px 10px; border-radius: 20px;
      font-size: 13px; font-weight: 700;
    }
    .ret-badge.profit { background: rgba(255,87,87,0.15); color: var(--up); }
    .ret-badge.loss   { background: rgba(61,185,255,0.15); color: var(--down); }
    .ret-badge.flat   { background: var(--badge-closed);   color: var(--closed); }

    .ret-price-wrap { display: flex; flex-direction: column; align-items: flex-end; gap: 2px; }
    .ret-current { font-size: 14px; font-weight: 700; }
    .ret-current.profit { color: var(--up); }
    .ret-current.loss   { color: var(--down); }
    .ret-current.flat   { color: var(--text2); }
    .ret-offer { font-size: 11px; color: var(--text3); text-decoration: line-through; }

    /* 스켈레톤 로딩 */
    .skel-row td { padding: 13px 16px; }
    .skel-line {
      background: var(--surface2); border-radius: 4px;
      animation: shimmer 1.4s infinite;
    }
    @keyframes shimmer { 0%,100% { opacity:0.4; } 50% { opacity:0.9; } }

    /* ── 상세 모달 ── */
    .modal-overlay {
      position: fixed; inset: 0; z-index: 1000;
      background: rgba(0,0,0,0.65);
      backdrop-filter: blur(4px);
      display: flex; align-items: center; justify-content: center;
      padding: 20px;
      animation: fadeIn 0.15s ease;
    }

    @keyframes fadeIn { from { opacity:0 } to { opacity:1 } }

    .modal {
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: 16px;
      width: 100%; max-width: 600px;
      max-height: 90vh; overflow-y: auto;
      animation: slideUp 0.2s cubic-bezier(.4,0,.2,1);
      position: relative;
    }

    @keyframes slideUp { from { transform:translateY(16px); opacity:0 } to { transform:translateY(0); opacity:1 } }

    .modal-header {
      padding: 24px 24px 0;
      display: flex; align-items: flex-start; justify-content: space-between;
      gap: 16px;
      position: sticky; top: 0;
      background: var(--surface);
      border-bottom: 1px solid var(--border);
      padding-bottom: 16px;
      z-index: 1;
    }

    .modal-title-wrap { flex: 1; min-width: 0; }

    .modal-name {
      font-size: 20px; font-weight: 800; margin-bottom: 6px;
    }

    .modal-meta {
      display: flex; gap: 8px; flex-wrap: wrap; align-items: center;
    }

    .modal-close {
      width: 32px; height: 32px; border-radius: 8px;
      background: var(--surface2); border: 1px solid var(--border);
      color: var(--text2); font-size: 16px;
      cursor: pointer; display: flex; align-items: center; justify-content: center;
      flex-shrink: 0; transition: background 0.15s;
    }

    .modal-close:hover { background: var(--border); }

    .modal-body { padding: 20px 24px 24px; display: flex; flex-direction: column; gap: 20px; }

    /* 섹션 */
    .modal-section { }

    .modal-section-title {
      font-size: 11px; font-weight: 700; color: var(--text3);
      text-transform: uppercase; letter-spacing: 0.08em;
      margin-bottom: 10px;
      display: flex; align-items: center; gap: 8px;
    }

    .modal-section-title::after {
      content: ''; flex: 1; height: 1px; background: var(--border);
    }

    /* 요약 스탯 그리드 */
    .stat-grid {
      display: grid; grid-template-columns: repeat(3, 1fr); gap: 8px;
    }

    .stat-box {
      background: var(--surface2); border: 1px solid var(--border);
      border-radius: 10px; padding: 12px;
    }

    .stat-label { font-size: 11px; color: var(--text3); margin-bottom: 4px; }
    .stat-value { font-size: 16px; font-weight: 700; }
    .stat-value.up { color: var(--up); }
    .stat-value.primary { color: var(--primary-light); }
    .stat-value.new-c { color: var(--new); }

    /* 증권사 테이블 */
    .broker-table { width: 100%; border-collapse: collapse; }
    .broker-table th {
      padding: 8px 12px; font-size: 11px; font-weight: 600;
      color: var(--text3); text-align: left; border-bottom: 1px solid var(--border);
      letter-spacing: 0.04em;
    }
    .broker-table th.right { text-align: right; }
    .broker-table td {
      padding: 10px 12px; font-size: 13px;
      border-bottom: 1px solid rgba(46,49,72,0.5);
    }
    .broker-table tr:last-child td { border-bottom: none; }
    .broker-table .broker-name { font-weight: 600; }
    .broker-table .broker-shares { color: var(--text2); text-align: right; }
    .broker-table .broker-limit { color: var(--text2); text-align: right; }

    .role-badge {
      font-size: 10px; padding: 1px 6px; border-radius: 4px; font-weight: 600;
    }
    .role-badge.lead { background: rgba(91,106,240,0.15); color: var(--primary-light); }
    .role-badge.co   { background: rgba(80,201,110,0.12); color: var(--ongoing); }

    /* 일정 리스트 */
    .schedule-list { display: flex; flex-direction: column; gap: 6px; }
    .schedule-row {
      display: flex; justify-content: space-between; align-items: center;
      padding: 8px 12px; background: var(--surface2); border-radius: 8px;
      font-size: 13px;
    }
    .schedule-key { color: var(--text3); }
    .schedule-val { font-weight: 600; color: var(--text); }
    .schedule-val.highlight { color: var(--primary-light); }

    /* 모달 로딩 */
    .modal-loading {
      display: flex; flex-direction: column; align-items: center;
      gap: 12px; padding: 40px; color: var(--text3); font-size: 13px;
    }

    /* 클릭 가능한 행 표시 */
    .ipo-table tbody tr { cursor: pointer; }
    .ipo-table tbody tr:hover td:first-child .company-name {
      color: var(--primary-light);
      text-decoration: underline;
      text-underline-offset: 3px;
    }

    /* 라인블록 배지 */
    .lineblock-badge {
      display: flex; align-items: center; gap: 6px;
      padding: 5px 12px; border-radius: 20px;
      background: linear-gradient(135deg, #229ED9, #1a7fb5);
      color: #fff; font-size: 12px; font-weight: 700;
      text-decoration: none;
      transition: opacity 0.2s, transform 0.2s;
      white-space: nowrap;
      box-shadow: 0 2px 8px rgba(34,158,217,0.35);
    }
    .lineblock-badge:hover { opacity: 0.85; transform: translateY(-1px); }

    /* 푸터 */
    .site-footer {
      border-top: 1px solid var(--border);
      padding: 24px;
      text-align: center;
    }
    .footer-inner {
      max-width: 1200px; margin: 0 auto;
      display: flex; align-items: center; justify-content: center; gap: 12px;
      flex-wrap: wrap;
    }
    .footer-text { font-size: 12px; color: var(--text3); }

    /* ── 진행중 카드 ── */
    .ongoing-cards {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(320px, 1fr));
      gap: 16px;
      padding: 16px 0;
    }
    .ongoing-cards.single { grid-template-columns: 1fr; }

    .ipo-card {
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: 16px;
      overflow: hidden;
      cursor: pointer;
      transition: transform 0.2s, box-shadow 0.2s, border-color 0.2s;
      position: relative;
    }
    /* 1개일 때 좌우 2열 레이아웃 */
    .ongoing-cards.single .ipo-card { display: flex; flex-direction: column; }
    .ongoing-cards.single .icard-body {
      display: grid;
      grid-template-columns: 1fr 1fr;
      flex: 1;
    }
    .ongoing-cards.single .icard-rate-section {
      border-right: 1px solid var(--border);
      border-bottom: none;
      border-top: 1px solid var(--border);
    }
    .ongoing-cards.single .icard-right {
      display: flex;
      flex-direction: column;
    }
    .ongoing-cards.single .icard-footer {
      flex: 1;
      display: grid;
      grid-template-columns: 1fr 1px 1fr 1px 1fr;
      align-content: center;
    }
    /* 균등 배정 섹션 */
    .icard-equal-section {
      padding: 14px 18px;
      border-top: 1px solid var(--border);
      background: var(--surface2);
    }
    .icard-equal-title {
      font-size: 11px; color: var(--text3); font-weight: 600;
      text-transform: uppercase; letter-spacing: 0.5px;
      margin-bottom: 10px;
      display: flex; align-items: center; gap: 6px;
    }
    .icard-equal-grid {
      display: grid;
      grid-template-columns: repeat(4, 1fr);
      gap: 8px;
    }
    .icard-equal-item {
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: 8px;
      padding: 8px 6px;
      text-align: center;
    }
    .icard-equal-applicants {
      font-size: 10px; color: var(--text3); margin-bottom: 4px;
    }
    .icard-equal-shares {
      font-size: 15px; font-weight: 800; color: var(--primary-light);
    }
    .icard-equal-shares.high { color: var(--ongoing); }
    .icard-equal-shares.low  { color: var(--text2); }
    .icard-equal-loading {
      font-size: 12px; color: var(--text3); text-align: center; padding: 4px 0;
    }
    /* 청약 마감 카운트다운 (경쟁률 없을 때) */
    .icard-closing-cd {
      padding: 4px 0 8px;
    }
    .icard-cd-label {
      font-size: 11px; color: var(--text3); font-weight: 600;
      text-transform: uppercase; letter-spacing: 0.5px; margin-bottom: 10px;
    }
    .icard-cd-boxes {
      display: flex; align-items: center; gap: 6px; margin-bottom: 8px;
    }
    .icard-cd-box {
      display: flex; flex-direction: column; align-items: center;
      background: var(--surface); border: 1px solid var(--border);
      border-radius: 8px; padding: 8px 12px; flex: 1;
    }
    .icard-cd-num {
      font-size: 24px; font-weight: 800; color: var(--primary-light);
      line-height: 1; font-variant-numeric: tabular-nums;
      font-feature-settings: "tnum";
    }
    .icard-cd-unit {
      font-size: 10px; color: var(--text3); margin-top: 3px;
    }
    .icard-cd-sep {
      font-size: 18px; font-weight: 700; color: var(--text3); flex-shrink: 0;
    }
    @media (max-width: 600px) {
      .ongoing-cards.single .icard-body { grid-template-columns: 1fr; }
      .ongoing-cards.single .icard-rate-section { border-right: none; border-bottom: 1px solid var(--border); }
      .icard-equal-grid { grid-template-columns: repeat(2, 1fr); }
    }
    .ipo-card::before {
      content: '';
      position: absolute;
      top: 0; left: 0; right: 0;
      height: 3px;
      background: linear-gradient(90deg, var(--card-accent, var(--primary)), var(--primary-light));
    }
    .ipo-card:hover {
      transform: translateY(-3px);
      box-shadow: 0 8px 32px rgba(0,0,0,0.25);
      border-color: var(--primary);
    }

    .icard-header {
      display: flex;
      align-items: center;
      gap: 12px;
      padding: 16px 18px 12px;
    }
    .icard-logo {
      width: 42px; height: 42px;
      background: linear-gradient(135deg, var(--primary), var(--primary-light));
      border-radius: 10px;
      display: flex; align-items: center; justify-content: center;
      font-size: 14px; font-weight: 800; color: #fff;
      flex-shrink: 0;
    }
    .icard-info { flex: 1; min-width: 0; }
    .icard-name { font-size: 16px; font-weight: 700; margin-bottom: 4px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
    .icard-badges { display: flex; align-items: center; gap: 6px; font-size: 12px; color: var(--text3); }
    .icard-dday {
      padding: 4px 10px;
      border-radius: 20px;
      font-size: 12px; font-weight: 700;
      background: rgba(91,106,240,0.15);
      color: var(--primary-light);
      white-space: nowrap;
      flex-shrink: 0;
    }
    .icard-dday.urgent {
      background: rgba(255,87,87,0.15);
      color: var(--up);
      animation: pulse-badge 1.5s infinite;
    }
    @keyframes pulse-badge {
      0%,100% { opacity:1; } 50% { opacity:0.6; }
    }

    .icard-rate-section {
      padding: 12px 18px 14px;
      background: var(--surface2);
      border-top: 1px solid var(--border);
      border-bottom: 1px solid var(--border);
    }
    .icard-rate-header {
      display: flex; align-items: center; justify-content: space-between;
      margin-bottom: 6px;
    }
    .icard-rate-label {
      display: flex; align-items: center; gap: 6px;
      font-size: 11px; color: var(--text3); font-weight: 600; text-transform: uppercase; letter-spacing: 0.5px;
    }
    .icard-live-dot {
      width: 6px; height: 6px;
      background: var(--ongoing);
      border-radius: 50%;
      animation: pulse 1.5s infinite;
    }
    .icard-rate-value {
      font-size: 30px; font-weight: 900;
      line-height: 1;
      margin-bottom: 8px;
    }
    .icard-rate-value.up   { color: var(--up); }
    .icard-rate-value.down { color: var(--down); }
    .icard-rate-value.primary { color: var(--primary-light); }

    .icard-bar-wrap { margin-bottom: 4px; }
    .icard-bar-bg {
      height: 6px;
      background: var(--border);
      border-radius: 3px;
      overflow: hidden;
    }
    .icard-bar-fill {
      height: 100%;
      border-radius: 3px;
      transition: width 0.6s cubic-bezier(.4,0,.2,1);
    }
    .icard-bar-fill.up      { background: linear-gradient(90deg, var(--up), #ff8a8a); }
    .icard-bar-fill.primary { background: linear-gradient(90deg, var(--primary), var(--primary-light)); }
    .icard-bar-fill.down    { background: linear-gradient(90deg, var(--down), #6bcfff); }
    .icard-rate-end { font-size: 11px; color: var(--text3); }
    .eq-live { padding: 14px 18px; border-top: 1px solid var(--border); background: var(--surface2); }
    .eq-title { font-size: 11px; color: var(--text3); font-weight: 600; margin-bottom: 6px; display: flex; align-items: center; gap: 8px; flex-wrap: wrap; }
    .eq-tag { font-size: 10px; padding: 1px 8px; border-radius: 10px; background: rgba(91,106,240,0.15); color: var(--primary-light); }
    .eq-main { font-size: 22px; font-weight: 800; color: var(--text); line-height: 1.2; }
    .eq-main b { color: var(--ongoing); }
    .eq-sub { font-size: 12px; color: var(--text2); margin-top: 4px; }
    .eq-note { font-size: 10.5px; color: var(--text3); margin-top: 6px; line-height: 1.5; }
    .modal .eq-live { border: 1px solid var(--border); border-radius: 10px; margin-bottom: 10px; background: var(--surface2); }
    .icard-rate-meta { display: flex; gap: 14px; font-size: 12px; color: var(--text2); margin: 6px 0 4px; }
    .icard-rate-meta b { color: var(--text); font-weight: 700; }

    .icard-footer {
      display: grid;
      grid-template-columns: 1fr 1px 1fr 1px 1fr;
      padding: 14px 18px;
      gap: 0;
    }
    .icard-stat { text-align: center; padding: 0 6px; }
    .icard-stat-label { font-size: 10px; color: var(--text3); text-transform: uppercase; letter-spacing: 0.4px; margin-bottom: 4px; }
    .icard-stat-value { font-size: 14px; font-weight: 700; margin-bottom: 2px; }
    .icard-stat-value.green { color: var(--ongoing); }
    .icard-stat-sub { font-size: 10px; color: var(--text3); }
    .icard-vdivider { background: var(--border); width: 1px; }

    /* ── 하단 상시 노출 섹션 ── */
    .bottom-sections {
      max-width: 1200px;
      margin: 0 auto;
      padding: 0 24px 48px;
    }
    .bottom-section-block {
      margin-top: 40px;
    }
    .bottom-section-header {
      display: flex;
      align-items: center;
      gap: 10px;
      margin-bottom: 16px;
      padding-bottom: 10px;
      border-bottom: 1px solid var(--border);
    }
    .bottom-section-header h2 {
      font-size: 16px;
      font-weight: 700;
    }
    .section-live-tag {
      font-size: 11px;
      font-weight: 700;
      color: var(--ongoing);
      background: rgba(80,201,110,0.12);
      padding: 2px 8px;
      border-radius: 10px;
    }

    /* ── 오늘 상장 ── */
    .today-listed-block { margin-bottom: 8px; }
    .today-listed-cards {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(280px, 1fr));
      gap: 16px;
      padding: 16px 0 8px;
    }
    .tl-card {
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: 16px;
      overflow: hidden;
      position: relative;
      cursor: pointer;
      transition: transform 0.2s, box-shadow 0.2s, border-color 0.2s;
    }
    .tl-card::before {
      content: '';
      position: absolute;
      top: 0; left: 0; right: 0; height: 3px;
      background: linear-gradient(90deg, var(--up), var(--primary-light));
    }
    .tl-card:hover { transform: translateY(-3px); box-shadow: 0 8px 32px rgba(0,0,0,0.25); border-color: var(--primary); }
    .tl-header { display: flex; align-items: center; gap: 12px; padding: 16px 18px 10px; }
    .tl-logo {
      width: 40px; height: 40px;
      background: linear-gradient(135deg, var(--primary), var(--primary-light));
      border-radius: 10px; display: flex; align-items: center; justify-content: center;
      font-size: 13px; font-weight: 800; color: #fff; flex-shrink: 0;
    }
    .tl-info { flex: 1; min-width: 0; }
    .tl-name { font-size: 15px; font-weight: 700; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
    .tl-badge-row { display: flex; align-items: center; gap: 6px; font-size: 11px; color: var(--text3); margin-top: 3px; }
    .tl-listed-tag {
      padding: 3px 9px; border-radius: 16px; font-size: 11px; font-weight: 700;
      background: rgba(80,201,110,0.15); color: var(--ongoing); flex-shrink: 0;
    }
    .tl-chart-wrap {
      padding: 0 18px 12px; display: flex; justify-content: center;
      background: var(--surface2);
    }
    .tl-chart-wrap img { width: 100%; max-height: 130px; object-fit: contain; border-radius: 8px; }
    .tl-chart-fallback { font-size: 12px; color: var(--text3); padding: 28px 0; text-align: center; width: 100%; }
    .tl-price-row {
      display: flex; align-items: baseline; justify-content: space-between;
      padding: 16px 18px 6px;
      border-top: 1px solid var(--border);
    }
    .tl-price { font-size: 22px; font-weight: 800; }
    .tl-price.up { color: var(--up); } .tl-price.down { color: var(--down); } .tl-price.flat { color: var(--text2); }
    .tl-change { font-size: 13px; font-weight: 700; }
    .tl-change.up { color: var(--up); } .tl-change.down { color: var(--down); } .tl-change.flat { color: var(--text3); }
    .tl-offer-row { padding: 0 18px 16px; font-size: 11px; color: var(--text3); }
    .tl-price-row { align-items: center; gap: 10px; }
    .tl-change-wrap { display: flex; flex-direction: column; align-items: flex-end; gap: 3px; }
    .tl-change-lbl { font-size: 11px; color: var(--text3); font-weight: 600; }
    .tl-change-pill { font-size: 15px; font-weight: 800; padding: 3px 12px; border-radius: 20px; white-space: nowrap; }
    .tl-change-amt { font-size: 12px; font-weight: 700; }
    .tl-change-wrap.up .tl-change-pill { background: rgba(255,87,87,0.15); color: var(--up); }
    .tl-change-wrap.up .tl-change-amt { color: var(--up); }
    .tl-change-wrap.down .tl-change-pill { background: rgba(61,185,255,0.15); color: var(--down); }
    .tl-change-wrap.down .tl-change-amt { color: var(--down); }
    .tl-change-wrap.flat .tl-change-pill { background: var(--badge-closed); color: var(--text2); }
    .tl-change-wrap.flat .tl-change-amt { color: var(--text3); }
    .tl-chart { padding: 4px 14px 8px; min-height: 34px; }
    .tl-chart-empty { font-size: 12px; color: var(--text3); text-align: center; padding: 14px 0; background: var(--surface2); border-radius: 10px; }
    .tl-chart-inner { color: var(--up); }
    .tl-chart-inner.down { color: var(--down); }
    .tl-chart-inner svg { width: 100%; height: auto; display: block; background: var(--surface2); border-radius: 10px; }
    .tl-chart-meta { display: flex; justify-content: space-between; font-size: 11px; color: var(--text3); margin-top: 6px; padding: 0 2px; }

    /* 테이블 행 최소 증거금 */
    .min-deposit {

      <svg width="14" height="14" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24">
        <circle cx="11" cy="11" r="8"/><path d="M21 21l-4.35-4.35"/>
      </svg>
      <input type="text" id="searchInput" placeholder="종목·주간사 검색..." oninput="applyFilters()" />
    </div>
    <select class="sort-select" id="sortSelect" onchange="applyFilters()">
      <option value="rate">청약률 순</option>
      <option value="date_asc">마감일 빠른 순</option>
      <option value="date_desc">마감일 느린 순</option>
      <option value="name">종목명 순</option>
    </select>
  </div>
  <div class="filter-right" id="resultCount"></div>
</div>

<div class="table-wrap" id="errorBanner"></div>

<div class="table-wrap">
  <div class="tab-panel active" id="panel-ongoing">
    <div class="loading-wrap"><div class="spinner"></div><p class="loading-text">데이터 불러오는 중...</p></div>
  </div>
  <div class="tab-panel" id="panel-new">
    <div class="loading-wrap"><div class="spinner"></div><p class="loading-text">데이터 불러오는 중...</p></div>
  </div>
  <div class="tab-panel" id="panel-closed">
    <div class="loading-wrap"><div class="spinner"></div><p class="loading-text">데이터 불러오는 중...</p></div>
  </div>
</div>

<!-- 항상 노출 하단 섹션 -->
<div class="bottom-sections">
  <div class="bottom-section-block" id="recentClosedBlock">
    <div class="bottom-section-header">
      <h2>최근 마감 인기 종목</h2>
    </div>
    <div class="recent-cards" id="recentCards">
      <div class="loading-wrap"><div class="spinner"></div></div>
    </div>
  </div>
  <div class="bottom-section-block" id="returnsBlock">
    <div class="bottom-section-header">
      <h2>공모가 대비 수익률</h2>
      <span class="section-live-tag">실시간</span>
    </div>
    <div class="returns-cards" id="returnsCards">
      <div class="loading-wrap"><div class="spinner"></div></div>
    </div>
  </div>
</div>

<script>
const IS_LOCAL = location.hostname === 'localhost' || location.hostname === '127.0.0.1';
const API = IS_LOCAL ? '/api/ipos?mock=1' : '/api/ipos';
const REFRESH_MS = 3 * 60 * 1000; // 3분

// ── 최소 청약 증거금 계산 ────────────────────────────────────────────────────

function minQtyOf(ipo) { return ipo.min_qty || 10; }

function minDepositAmt(ipo) {
  // 확정 공모가 우선, 없으면 희망밴드 상단
  let price = ipo.price;
  if (!price && ipo.price_range) {
    const m = ipo.price_range.replace(/,/g, '').match(/(\d+)\s*$/);
    if (m) price = parseInt(m[1]);
  }
  if (!price) return null;
  return price * minQtyOf(ipo) * 0.5; // 최소 청약 수량 × 50% 증거금
}

function fmtMoney(n) {
  if (n === null || n === undefined) return null;
  if (n >= 10000000 && n % 10000000 === 0) return (n / 10000000) + '천만원';
  if (n >= 100000 && n % 10000 === 0)      return (n / 10000) + '만원';
  if (n >= 10000000) return Math.round(n / 10000).toLocaleString() + '만원';
  return n.toLocaleString() + '원';
}

function minDepositLabel(ipo) {
  const amt = minDepositAmt(ipo);
  if (!amt) return null;
  const base = ipo.price ? '' : '(희망밴드 상단 기준)';
  return fmtMoney(amt) + (base ? `<span style="font-size:10px;color:var(--text3)"> ${base}</span>` : '');
}

let allData = { ongoing: [], new: [], closed: [] };
let currentTab = 'ongoing';
let tabInitDone = false;
let liveAt = '';
const generalSharesCache = {};

// ── Helpers ──────────────────────────────────────────────────────────────────

function today() {
  return new Date(Date.now() + 9 * 3600000).toISOString().slice(0, 10); // KST
}

function addDaysIso(iso, n) {
  return new Date(Date.parse(iso) + n * 86400000).toISOString().slice(0, 10);
}

function thisWeekUpcoming() {
  const t = today(), end = addDaysIso(t, 7);
  return allData.new
    .filter(d => d.date_start && d.date_start >= t && d.date_start <= end)
    .sort((a, b) => a.date_start.localeCompare(b.date_start));
}

function fmtDate(iso) {
  if (!iso) return '—';
  const [, m, d] = iso.split('-');
  return `${+m}/${+d}`;
}

function dday(endIso) {
  if (!endIso) return null;
  const diff = Math.ceil((new Date(endIso) - new Date(today())) / 86400000);
  if (diff === 0) return { label: 'D-Day', cls: 'today' };
  if (diff > 0)  return { label: `D-${diff}`, cls: 'soon' };
  return null;
}

function rateClass(rate) {
  if (!rate) return 'na';
  if (rate >= 500) return 'hot';
  if (rate >= 100) return 'warm';
  return 'cool';
}

function barWidth(rate) {
  if (!rate) return 0;
  return Math.min(100, (Math.log10(rate + 1) / Math.log10(4001)) * 100);
}

function abbr(name) {
  return name.replace(/[^가-힣a-zA-Z0-9]/g, '').slice(0, 2).toUpperCase();
}

function ipoAttr(o) {
  return JSON.stringify(o).replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' })[c]);
}

function escHtml(s) {
  if (!s) return '';
  return String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;').replace(/'/g,'&#39;');
}

// ── Render ────────────────────────────────────────────────────────────────────

function statusBadge(s) {
  const m = { ongoing: ['진행중', 'ongoing'], new: ['예정', 'new'], closed: ['마감', 'closed'] };
  const [label, cls] = m[s] || ['—', 'closed'];
  return `<span class="status-badge ${cls}">${escHtml(label)}</span>`;
}

function exchangeBadge(market) {
  return market === 'kospi'
    ? `<span class="exchange kospi">KOSPI</span>`
    : `<span class="exchange kosdaq">KOSDAQ</span>`;
}

function rateCell(rate, endIso, showDday) {
  const rc = rateClass(rate);
  const bw = barWidth(rate);
  const rateLabel = rate ? `${rate.toLocaleString()}:1` : '청약 전';
  const ddayEl = showDday && endIso ? (() => {
    const dd = dday(endIso);
    return dd ? `<span class="dday ${dd.cls}">${dd.label}</span>` : '';
  })() : '';

  return `<td class="rate-cell">
    <div class="rate-header">
      <span class="rate-value ${rc}">${escHtml(rateLabel)}</span>
      ${ddayEl}
    </div>
    <div class="rate-bar-bg"><div class="rate-bar-fill ${rc}" style="width:${bw}%"></div></div>
  </td>`;
}

function buildOngoingEmpty() {
  const next = allData.new[0];
  return `<div class="ongoing-none">
    <b>지금 청약 진행 중인 공모주가 없습니다.</b><br>
    ${next ? `다음 청약은 <b>${escHtml(next.name)}</b> (${fmtDate(next.date_start)} 시작)입니다.` : '예정된 청약이 등록되면 이곳에 표시됩니다.'}
  </div>`;
}

function buildNextCard(next) {
  const startMs = new Date(next.date_start + 'T09:00:00+09:00');
  nxFromMs = startMs.getTime() - 7 * 86400000;
  setTimeout(() => startCountdown(startMs), 0);
  setTimeout(() => loadCountdownDetail(next), 0);

  const dep = minDepositAmt(next);
  const daysUntil = Math.ceil((startMs - Date.now()) / 86400000);
  const soonLabel = daysUntil <= 1 ? 'D-DAY' : `D-${daysUntil}`;
  const wd = ['일','월','화','수','목','금','토'][new Date(next.date_start + 'T12:00:00+09:00').getUTCDay()];
  const priceLabel = next.price ? next.price.toLocaleString() + '원' : (next.price_range || '미확정');
  const priceName = next.price ? '확정 공모가' : '희망 공모가';

  return `
    <div class="hero-card">
      <div class="hero-kicker">다음 청약 예정</div>
      <div class="nx-card" onclick='openModal(${ipoAttr(next)})'>
        <div class="nx-left">
          <div class="nx-head">
            <div class="cd-logo">${escHtml(abbr(next.name))}</div>
            <div class="nx-title">
              <div class="nx-name">${escHtml(next.name)}</div>
              <div class="cd-badges">${exchangeBadge(next.market)}${next.underwriter ? `<span>${escHtml(next.underwriter)}</span>` : ''}</div>
            </div>
            <div class="cd-soon-tag">${escHtml(soonLabel)}</div>
          </div>
          <div class="cd-boxes" id="cdBoxes">
            <div class="cd-box"><span class="cd-num highlight" id="cd-d">--</span><span class="cd-label">일</span></div>
            <span class="cd-sep">:</span>
            <div class="cd-box"><span class="cd-num" id="cd-h">--</span><span class="cd-label">시간</span></div>
            <span class="cd-sep">:</span>
            <div class="cd-box"><span class="cd-num" id="cd-m">--</span><span class="cd-label">분</span></div>
            <span class="cd-sep">:</span>
            <div class="cd-box"><span class="cd-num" id="cd-s">--</span><span class="cd-label">초</span></div>
          </div>
          <div class="nx-prog">
            <div class="nx-prog-bar"><div class="nx-prog-fill" id="nx-prog-fill"></div></div>
            <div class="nx-prog-labels"><span id="nx-prog-from">7일 전</span><span>청약 시작</span></div>
          </div>
          <div class="nx-when"><b>${fmtDate(next.date_start)}(${wd}) 09:00</b> 청약 시작 · ${fmtDate(next.date_end)} 16:00 마감</div>
          <div class="nx-tl" id="nx-timeline"></div>
        </div>

        <div class="nx-right">
          <div class="nx-deposit">
            <div class="nx-dep-label">최소 청약 증거금</div>
            <div class="nx-dep-value">${dep ? fmtMoney(dep) : '미확정'}</div>
            <div class="nx-dep-sub">${minQtyOf(next)}주 청약 · 증거금 50%${next.price ? '' : ' · 희망가 상단 기준'}${next.min_qty_confirmed ? '' : ' · 10주 가정'}</div>
          </div>
          <div class="nx-grid">
            <div class="nx-item"><div class="nx-k">${priceName}</div><div class="nx-v">${escHtml(priceLabel)}</div></div>
            <div class="nx-item"><div class="nx-k">청약 기간</div><div class="nx-v">${fmtDate(next.date_start)} ~ ${fmtDate(next.date_end)}</div></div>
            <span id="cd-detail-body" style="display:contents"></span>
          </div>
          <div class="nx-equal" id="nx-equal"></div>
          <button class="nx-btn" type="button">상세 · 증권사별 배정 보기 →</button>
        </div>
      </div>
    </div>`;
}

function parseDotRange(str) {
  if (!str) return null;
  const m = String(str).match(/(\d{4})\.(\d{2})\.(\d{2})(?:\s*~\s*(?:(\d{4})\.)?(\d{2})\.(\d{2}))?/);
  if (!m) return null;
  const a = `${m[1]}-${m[2]}-${m[3]}`;
  const b = m[5] ? `${m[4] || m[1]}-${m[5]}-${m[6]}` : a;
  return [a, b];
}

function renderNextTimeline(next, detail) {
  const el = document.getElementById('nx-timeline');
  if (!el) return;
  const sc = detail.schedule || {};
  const steps = [
    ['수요예측', parseDotRange(sc['수요예측일'])],
    ['청약', parseDotRange(sc['청약일']) || [next.date_start, next.date_end]],
    ['납입', parseDotRange(sc['납입일'])],
    ['상장', parseDotRange(sc['상장일'] || detail.listing_date)],
  ];
  const t = today();
  let nextMarked = false;
  const md = iso => { const [, m, d] = iso.split('-'); return `${+m}/${+d}`; };
  el.innerHTML = steps.map(([name, r]) => {
    let cls = 'future', label = '미정';
    if (r) {
      label = r[0] === r[1] ? md(r[0]) : `${md(r[0])}~${md(r[1])}`;
      if (r[1] < t) cls = 'done';
      else if (r[0] <= t) cls = 'active';
      else if (!nextMarked) { cls = 'next'; nextMarked = true; }
    }
    return `<div class="nx-tl-step ${cls}"><span class="nx-dot"></span><span class="nx-tl-name">${name}</span><span class="nx-tl-date">${label}</span></div>`;
  }).join('');

  const dem = steps[0][1];
  if (dem) {
    nxFromMs = new Date(dem[1] + 'T16:00:00+09:00').getTime();
    const f = document.getElementById('nx-prog-from');
    if (f) f.textContent = `수요예측 종료 ${md(dem[1])}`;
  }
}

function loadCountdownDetail(next) {
  if (!next.no) return;
  const el = document.getElementById('cd-detail-body');
  if (!el) return;
  fetch(`/api/ipos/${next.no}/detail`)
    .then(r => r.json())
    .then(detail => {
      const item = (k, v, color) => `<div class="nx-item"><div class="nx-k">${k}</div><div class="nx-v"${color ? ` style="color:${color}"` : ''}>${escHtml(v)}</div></div>`;
      let html = '';
      if (detail.listing_date) html += item('상장 예정일', detail.listing_date);
      if (detail.institutional) html += item('기관 경쟁률', detail.institutional, 'var(--primary-light)');
      if (detail.lockup) html += item('의무보유확약', detail.lockup, 'var(--ongoing)');
      el.innerHTML = html;
      renderNextTimeline(next, detail);

      const eq = document.getElementById('nx-equal');
      if (eq && detail.general_shares) {
        const pool = Math.floor(detail.general_shares * 0.5);
        const pills = [10000, 30000, 100000].map(n => {
          const sh = Math.floor(pool / n);
          return `<div class="nx-eq"><span>${n / 10000}만명 참여</span><b>${sh > 0 ? sh + '주' : '추첨'}</b></div>`;
        }).join('');
        eq.innerHTML = `<div class="nx-eq-title">균등배정 예상 (일반청약 ${detail.general_shares.toLocaleString()}주 기준)</div><div class="nx-eq-row">${pills}</div>`;
      }
    })
    .catch(() => {});
}

function renderHero() {
  const el = document.getElementById('nextHero');
  if (!el) return;
  const heroNext = !allData.ongoing.length && allData.new.length ? allData.new[0] : null;
  const week = thisWeekUpcoming().filter(d => !heroNext || d.no !== heroNext.no);
  let html = '';
  if (heroNext) html += buildNextCard(heroNext);
  if (week.length) {
    html += `<div class="week-title">${heroNext ? '이 외 이번 주 청약 예정' : '이번 주 청약 예정'} <span class="pill">${week.length}</span></div>
      <div class="week-strip">${week.map(d => {
        const dd = dday(d.date_start);
        const dep = minDepositAmt(d);
        return `<div class="week-chip" onclick='openModal(${ipoAttr(d)})'>
          <div class="wc-top"><span class="wc-name">${escHtml(d.name)}</span>${dd ? `<span class="wc-dd">${dd.label}</span>` : ''}</div>
          <div class="wc-date">${fmtDate(d.date_start)} ~ ${fmtDate(d.date_end)} · ${d.market === 'kospi' ? '코스피' : '코스닥'}</div>
          <div class="wc-dep">${dep ? '최소 ' + fmtMoney(dep) : '공모가 미정'}</div>
        </div>`;
      }).join('')}</div>`;
  }
  el.innerHTML = html;
  el.style.display = html ? '' : 'none';
}

function buildRateSection(d, cardId) {
  const rc = rateClass(d.rate);
  const bw = barWidth(d.rate);
  return `
        <div class="icard-rate-section">
          <div class="icard-rate-header">
            <span class="icard-rate-label">
              <span class="icard-live-dot"></span>
              ${d.rate ? (d.date_end && Date.now() >= new Date(d.date_end + 'T16:00:00+09:00') ? '최종 청약 경쟁률' : '실시간 청약 경쟁률') : '청약 진행 중'}
            </span>
          </div>
          ${d.rate
            ? `<div class="icard-rate-value ${rc}">${d.rate.toLocaleString()}:1</div>
               <div class="icard-bar-wrap"><div class="icard-bar-bg"><div class="icard-bar-fill ${rc}" style="width:${bw}%"></div></div></div>
               ${(d.prop_rate || d.applications) ? `<div class="icard-rate-meta">${d.prop_rate ? `<span>비례 <b>${d.prop_rate.toLocaleString()}:1</b></span>` : ''}${d.applications ? `<span>신청 <b>${d.applications.toLocaleString()}건</b></span>` : ''}</div>` : ''}
               <div class="icard-rate-end">마감 ${escHtml(d.date_end || '—')} 16:00${d.rate_src === 'naver' ? ' · 네이버 증권 집계 기준' + (liveAt ? ' · ' + liveAt + ' 갱신' : '') : ''}</div>`
            : `<div class="icard-closing-cd" id="${cardId}-closing">
                 <div class="icard-cd-label">청약 마감까지</div>
                 <div class="icard-cd-boxes">
                   <div class="icard-cd-box"><span class="icard-cd-num" id="${cardId}-h">--</span><span class="icard-cd-unit">시간</span></div>
                   <span class="icard-cd-sep">:</span>
                   <div class="icard-cd-box"><span class="icard-cd-num" id="${cardId}-m">--</span><span class="icard-cd-unit">분</span></div>
                   <span class="icard-cd-sep">:</span>
                   <div class="icard-cd-box"><span class="icard-cd-num" id="${cardId}-s">--</span><span class="icard-cd-unit">초</span></div>
                 </div>
                 <div class="icard-rate-end">마감 ${escHtml(d.date_end || '—')} 16:00</div>
               </div>`
          }
        </div>`;
}

function buildOngoingCards(data) {
  if (!data.length) return buildOngoingEmpty();

  const single = data.length === 1;

  return `<div class="ongoing-cards${single ? ' single' : ''}">
    ${data.map(d => {
      const rc = rateClass(d.rate);
      const bw = barWidth(d.rate);
      const dep = minDepositAmt(d);
      const dd = d.date_end ? dday(d.date_end) : null;
      const ddLabel = dd ? dd.label : '';
      const ddUrgent = d.date_end && dday(d.date_end)?.n <= 1 ? ' urgent' : '';
      const accentMap = { up: 'var(--up)', primary: 'var(--primary)', down: 'var(--down)' };
      const accent = accentMap[rc] || 'var(--primary)';
      const cardId = 'card-' + (d.no || d.name.replace(/\s/g,''));

      const rateSection = buildRateSection(d, cardId);

      const footerSection = `
        <div class="icard-footer">
          <div class="icard-stat">
            <div class="icard-stat-label">공모가</div>
            <div class="icard-stat-value">${d.price ? d.price.toLocaleString()+'원' : '미확정'}</div>
            <div class="icard-stat-sub">${escHtml(d.price_range || '—')}</div>
          </div>
          <div class="icard-vdivider"></div>
          <div class="icard-stat">
            <div class="icard-stat-label">최소 증거금</div>
            <div class="icard-stat-value green">${dep ? fmtMoney(dep) : '—'}</div>
            <div class="icard-stat-sub">${minQtyOf(d)}주 · 50%</div>
          </div>
          <div class="icard-vdivider"></div>
          <div class="icard-stat">
            <div class="icard-stat-label">청약 기간</div>
            <div class="icard-stat-value" style="font-size:12px">${fmtDate(d.date_start)} ~ ${fmtDate(d.date_end)}</div>
            <div class="icard-stat-sub">${escHtml(d.underwriter || '—')}</div>
          </div>
        </div>`;

      const detailSection = `
        <div class="cd-detail-section" id="${cardId}-detail">
          <div class="cd-detail-loading" style="grid-column:1/-1">수요예측 정보 불러오는 중...</div>
        </div>`;

      const equalSection = single ? `
        <div class="icard-equal-section" id="${cardId}-equal">
          <div class="icard-equal-title">
            <span class="icard-live-dot"></span>
            균등 배정 예상 수량 (청약자 수별)
          </div>
          <div class="icard-equal-loading" id="${cardId}-equal-body">데이터 불러오는 중...</div>
        </div>` : '';

      const eqLiveBox = `<div id="${cardId}-eqlive"></div>`;
      const bodyHtml = single
        ? `<div class="icard-body">${rateSection}<div class="icard-right">${footerSection}</div></div>${detailSection}${eqLiveBox}${equalSection}`
        : `${rateSection}${footerSection}${detailSection}${eqLiveBox}`;

      return `<div class="ipo-card" id="${cardId}" style="--card-accent:${accent}" onclick='openModal(${ipoAttr(d)})'>
        <div class="icard-header">
          <div class="icard-logo">${escHtml(abbr(d.name))}</div>
          <div class="icard-info">
            <div class="icard-name">${escHtml(d.name)}</div>
            <div class="icard-badges">
              ${exchangeBadge(d.market)}
              ${d.underwriter ? `<span>${escHtml(d.underwriter)}</span>` : ''}
            </div>
          </div>
          ${ddLabel ? `<div class="icard-dday${ddUrgent}">${escHtml(ddLabel)}</div>` : ''}
        </div>
        ${bodyHtml}
      </div>`;
    }).join('')}
  </div>`;
}

function equalExpectHtml(d, generalShares) {
  if (!d.applications || !generalShares) return '';
  const pool = Math.floor(generalShares * 0.5);
  const per = pool / d.applications;

const tlChartCache = {};

function buildTlChart(points, offer) {
  const nowKst = new Date(Date.now() + 9 * 3600000);
  const afterOpen = nowKst.getUTCHours() * 60 + nowKst.getUTCMinutes() >= 540;
  if (!points || !points.length) {
    return `<div class="tl-chart-empty">${afterOpen ? '차트 데이터를 불러오는 중입니다' : '장 시작 전입니다 · 09:00부터 분 단위 차트가 표시됩니다'}</div>`;
  }
  const W = 340, H = 118, L = 4, R = 4, T = 10, B = 18;
  const toMin = hhmm => Math.min(390, Math.max(0, parseInt(hhmm.slice(0, 2), 10) * 60 + parseInt(hhmm.slice(2), 10) - 540));
  const prices = points.map(p => p[1]);
  const lo = Math.min(...prices, offer || Infinity), hi = Math.max(...prices, offer || -Infinity);
  const pad = (hi - lo) * 0.14 || (offer || hi) * 0.01;
  const yMin = lo - pad, yMax = hi + pad;
  const x = m => L + (m / 390) * (W - L - R);
  const y = p => T + (1 - (p - yMin) / (yMax - yMin)) * (H - T - B);
  const pts = points.map(p => [x(toMin(p[0])), y(p[1])]);
  const line = pts.map((q, i) => (i ? 'L' : 'M') + q[0].toFixed(1) + ' ' + q[1].toFixed(1)).join(' ');
  const area = line + ` L${pts[pts.length - 1][0].toFixed(1)} ${H - B} L${pts[0][0].toFixed(1)} ${H - B} Z`;
  const last = prices[prices.length - 1];
  const dir = !offer || last >= offer ? 'up' : 'down';
  const gid = 'tlg' + Math.random().toString(36).slice(2, 8);
  const offerY = offer ? y(offer).toFixed(1) : null;
  const lastPt = pts[pts.length - 1];
  return `<div class="tl-chart-inner ${dir}">
    <svg viewBox="0 0 ${W} ${H}" role="img" aria-label="오늘 분 단위 주가 차트">
      <defs><linearGradient id="${gid}" x1="0" y1="0" x2="0" y2="1">
        <stop offset="0" stop-color="currentColor" stop-opacity="0.28"/><stop offset="1" stop-color="currentColor" stop-opacity="0"/>
      </linearGradient></defs>
      ${offerY ? `<line x1="${L}" x2="${W - R}" y1="${offerY}" y2="${offerY}" stroke="var(--text3)" stroke-width="1" stroke-dasharray="4 4"/>
      <text x="${L + 2}" y="${(+offerY - 4).toFixed(1)}" font-size="9" fill="var(--text3)">공모가 ${offer.toLocaleString()}</text>` : ''}
      <path d="${area}" fill="url(#${gid})"/>
      <path d="${line}" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linejoin="round" stroke-linecap="round"/>
      <circle cx="${lastPt[0].toFixed(1)}" cy="${lastPt[1].toFixed(1)}" r="3.2" fill="currentColor"/>
      <text x="${L}" y="${H - 4}" font-size="9" fill="var(--text3)">09:00</text>
      <text x="${x(180)}" y="${H - 4}" font-size="9" fill="var(--text3)" text-anchor="middle">12:00</text>
      <text x="${W - R}" y="${H - 4}" font-size="9" fill="var(--text3)" text-anchor="end">15:30</text>
    </svg>
    <div class="tl-chart-meta"><span>고가 ${Math.max(...prices).toLocaleString()}</span><span>저가 ${Math.min(...prices).toLocaleString()}</span><span>${(points.length)}분 데이터</span></div>
  </div>`;
}

function hydrateTlChart(d) {
  if (!d.stock_code) return;
  fetch(`/api/chart/${encodeURIComponent(d.stock_code)}`)
    .then(r => r.json())
    .then(points => {
      const html = buildTlChart(points, d.offer_price);
      tlChartCache[d.stock_code] = html;
      document.querySelectorAll(`.tl-chart[data-code="${d.stock_code}"]`).forEach(el => { el.innerHTML = html; });
    })
    .catch(() => {});
}

const cardCdTimers = {};

function startCardCountdowns(data) {
  // 기존 타이머 정리
  Object.values(cardCdTimers).forEach(t => clearInterval(t));
  Object.keys(cardCdTimers).forEach(k => delete cardCdTimers[k]);

  data.filter(d => !d.rate && d.date_end).forEach(d => {
    const cardId = 'card-' + (d.no || d.name.replace(/\s/g,''));
    // 마감일 16:00 KST 기준
    const endMs = new Date(d.date_end + 'T16:00:00+09:00').getTime();

    function tick() {
      const diff = endMs - Date.now();
      const hEl = document.getElementById(cardId + '-h');
      const mEl = document.getElementById(cardId + '-m');
      const sEl = document.getElementById(cardId + '-s');
      if (!hEl) { clearInterval(cardCdTimers[cardId]); return; }
      if (diff <= 0) {
        hEl.textContent = '00'; mEl.textContent = '00'; sEl.textContent = '00';
        clearInterval(cardCdTimers[cardId]); return;
      }
      const totalH = Math.floor(diff / 3600000);
      const m = Math.floor((diff % 3600000) / 60000);
      const s = Math.floor((diff % 60000) / 1000);
      hEl.textContent = String(totalH).padStart(2, '0');
      mEl.textContent = String(m).padStart(2, '0');
      sEl.textContent = String(s).padStart(2, '0');
    }
    tick();
    cardCdTimers[cardId] = setInterval(tick, 1000);
  });
}

function startCountdown(targetMs) {
  if (cdTimer) clearInterval(cdTimer);
  function tick() {
    const diff = targetMs - Date.now();
    if (diff <= 0) { clearInterval(cdTimer); return; }
    const d = Math.floor(diff / 86400000);
    const h = Math.floor((diff % 86400000) / 3600000);
    const m = Math.floor((diff % 3600000) / 60000);
    const s = Math.floor((diff % 60000) / 1000);
    const el = (id, v) => { const e = document.getElementById(id); if(e) e.textContent = String(v).padStart(2,'0'); };
    const prevS = document.getElementById('cd-s');
    const changed = prevS && prevS.textContent !== String(s).padStart(2,'0');
    el('cd-d', d); el('cd-h', h); el('cd-m', m); el('cd-s', s);
    if (changed) { prevS.classList.remove('tick'); void prevS.offsetWidth; prevS.classList.add('tick'); }
    const fill = document.getElementById('nx-prog-fill');
    if (fill && nxFromMs) fill.style.width = Math.min(100, Math.max(0, (Date.now() - nxFromMs) / (targetMs - nxFromMs) * 100)).toFixed(1) + '%';
  }
  tick();
  cdTimer = setInterval(tick, 1000);
}

// ── Filter / Sort ─────────────────────────────────────────────────────────────

function filtered(dataset) {
  const q = document.getElementById('searchInput').value.trim().toLowerCase();
  const sort = document.getElementById('sortSelect').value;

  let data = [...dataset];
  if (q) {
    data = data.filter(d =>
      d.name.toLowerCase().includes(q) ||
      (d.underwriter || '').toLowerCase().includes(q)
    );
  }

  if (sort === 'rate') data.sort((a, b) => (b.rate || 0) - (a.rate || 0));
  else if (sort === 'date_asc') data.sort((a, b) => (a.date_end || '').localeCompare(b.date_end || ''));
  else if (sort === 'date_desc') data.sort((a, b) => (b.date_end || '').localeCompare(a.date_end || ''));
  else data.sort((a, b) => a.name.localeCompare(b.name));

  return data;
}

// ── Data fetch ────────────────────────────────────────────────────────────────

async function fetchData() {
  try {
    const res = await fetch(API);
    if (!res.ok) throw new Error(`HTTP ${res.status}`);
    const data = await res.json();
    const prevOngoing = allData.ongoing;
    allData.ongoing = (data.ongoing || []).map(n => {
      const o = prevOngoing.find(x => x.no === n.no);
      if (o && o.applications != null && (n.applications == null || o.applications > n.applications)
          && !(n.date_end && Date.now() >= new Date(n.date_end + 'T16:00:00+09:00'))) {
        return { ...n, rate: o.rate, prop_rate: o.prop_rate, applications: o.applications, rate_src: o.rate_src || n.rate_src };
      }
      return n;
    });
    allData.new = data.new || [];
    allData.closed = data.closed || [];

    if (!tabInitDone) {
      tabInitDone = true;
      if (!allData.ongoing.length && allData.new.length) {
        currentTab = 'new';
        document.querySelectorAll('.tab, .tab-panel').forEach(e => e.classList.remove('active'));
        document.querySelector('.t-new').classList.add('active');
        document.getElementById('panel-new').classList.add('active');
      }
    }
    renderHero();

    document.getElementById('updateTime').textContent =
      `업데이트: ${data.updated_at ? data.updated_at.slice(11,19) : '—'}`;
    document.getElementById('errorBanner').innerHTML = '';
    render();
  } catch (e) {
    document.getElementById('updateTime').textContent = '업데이트 실패';
    document.getElementById('errorBanner').innerHTML =
      `<div class="error-banner">⚠️ 데이터를 불러오지 못했습니다: ${escHtml(e.message)}</div>`;
  }
}


// ── 진행 중 종목 경쟁률 실시간 갱신 (30초) ───────────────────────────────────
function isSubscribing(d) {
  return d.date_end && Date.now() < new Date(d.date_end + 'T16:00:00+09:00').getTime();
}

async function pollLive() {
  if (document.hidden) return;
  if (!allData.ongoing.some(isSubscribing)) return;
  try {
    const res = await fetch('/api/live', { cache: 'no-store' });
    if (!res.ok) return;
    const live = await res.json();
    liveAt = (live.updated_at || '').slice(11, 19);
    let needFull = false;
    for (const it of live.items || []) {
      const d = allData.ongoing.find(x => x.no === it.no);
      if (!d || !isSubscribing(d)) continue;
      if (it.rate == null && it.applications == null) continue;
      // 신청건수는 줄어들 수 없으므로 더 작은 값은 무시
      if (d.applications != null && it.applications != null && it.applications < d.applications) continue;
      const hadRate = d.rate != null;
      d.rate = it.rate ?? d.rate;
      d.rate_raw = d.rate != null ? d.rate + ':1' : d.rate_raw;
      d.rate_src = 'naver';
      d.prop_rate = it.prop_rate ?? d.prop_rate;
      d.applications = it.applications ?? d.applications;
      const cardId = 'card-' + (d.no || d.name.replace(/\s/g, ''));
      const card = document.getElementById(cardId);
      if (!card) { needFull = true; continue; }
      const rs = card.querySelector('.icard-rate-section');
      if (rs) {
        const tmp = document.createElement('div');
        tmp.innerHTML = buildRateSection(d, cardId).trim();
        rs.replaceWith(tmp.firstElementChild);
      }
      const eq = document.getElementById(cardId + '-eqlive');
      if (eq) eq.innerHTML = equalExpectHtml(d, generalSharesCache[d.no]);
      if (!hadRate && d.rate != null) needFull = true;
    }
    if (needFull) render();
    const ut = document.getElementById('updateTime');
    if (ut && liveAt) ut.textContent = `업데이트: ${liveAt}`;
  } catch (e) { /* 다음 주기에 재시도 */ }
}

  const saved = localStorage.getItem('theme') || 'dark';
  const toggle = document.getElementById('themeToggle');
  if (saved === 'light') {
    document.documentElement.setAttribute('data-theme', 'light');
    toggle.checked = true;
  }
}

initTheme();
fetchData();
setInterval(fetchData, REFRESH_MS);
setInterval(pollLive, 30000);
pollLive();
</script>
