  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }

    /* ── 다크 모드 (기본) ── */
    :root {
      --bg: #0f1117;
      --surface: #1a1d27;
      --surface2: #222535;
      --border: #2e3148;
      --primary: #5b6af0;
      --primary-light: #7b8af5;
      --up: #ff5757;
      --down: #3db9ff;
      --text: #e8eaf6;
      --text2: #8b8fa8;
      --text3: #5c6080;
      --new: #f0a040;
      --ongoing: #50c96e;
      --closed: #8b8fa8;
      --badge-new: rgba(240,160,64,0.15);
      --badge-ongoing: rgba(80,201,110,0.15);
      --badge-closed: rgba(139,143,168,0.12);
    }

    /* ── 라이트 모드 ── */
    [data-theme="light"] {
      --bg: #f4f6fb;
      --surface: #ffffff;
      --surface2: #eef1f8;
      --border: #dde1ee;
      --primary: #4a58e0;
      --primary-light: #6270e8;
      --up: #e03535;
      --down: #1e9fd4;
      --text: #13172e;
      --text2: #4a5068;
      --text3: #8690a8;
      --new: #d47c10;
      --ongoing: #27a84e;
      --closed: #7a8099;
      --badge-new: rgba(212,124,16,0.12);
      --badge-ongoing: rgba(39,168,78,0.12);
      --badge-closed: rgba(122,128,153,0.1);
    }

    /* 테마 전환 트랜지션 */
    *, *::before, *::after {
      transition: background-color 0.25s ease, border-color 0.25s ease, color 0.2s ease;
    }

    body {
      background: var(--bg);
      color: var(--text);
      font-family: 'Apple SD Gothic Neo', 'Noto Sans KR', -apple-system, sans-serif;
      min-height: 100vh;
    }

    header {
      background: var(--surface);
      border-bottom: 1px solid var(--border);
      padding: 0 24px;
      position: sticky;
      top: 0;
      z-index: 100;
    }

    .header-inner {
      max-width: 1200px;
      margin: 0 auto;
      display: flex;
      align-items: center;
      justify-content: space-between;
      height: 60px;
    }

    .logo {
      display: flex;
      align-items: center;
      gap: 10px;
      font-size: 18px;
      font-weight: 700;
    }

    .logo-icon {
      width: 32px; height: 32px;
      border-radius: 8px;
      overflow: hidden;
      display: flex; align-items: center; justify-content: center;
    }

    .header-right {
      display: flex;
      align-items: center;
      gap: 16px;
      font-size: 12px;
    }

    .live-dot {
      display: flex; align-items: center; gap: 6px;
      color: var(--ongoing); font-size: 12px;
    }

    .live-dot::before {
      content: '';
      width: 7px; height: 7px;
      background: var(--ongoing);
      border-radius: 50%;
      animation: pulse 1.5s infinite;
    }

    @keyframes pulse {
      0%,100% { opacity:1; transform:scale(1); }
      50% { opacity:0.5; transform:scale(1.3); }
    }

    .source-badge {
      font-size: 11px; color: var(--text3);
      background: var(--surface2);
      border: 1px solid var(--border);
      border-radius: 4px;
      padding: 3px 8px;
    }

    .update-time { font-size: 11px; color: var(--text3); }

    /* ── 테마 토글 ── */
    .theme-toggle {
      position: relative;
      width: 52px; height: 28px;
      cursor: pointer; flex-shrink: 0;
    }

    .theme-toggle input {
      opacity: 0; width: 0; height: 0; position: absolute;
    }

    .toggle-track {
      position: absolute; inset: 0;
      background: var(--surface2);
      border: 1px solid var(--border);
      border-radius: 14px;
      transition: background 0.25s, border-color 0.25s;
      display: flex; align-items: center;
      padding: 0 4px;
      justify-content: space-between;
    }

    .toggle-icon { font-size: 12px; line-height: 1; pointer-events: none; }

    .toggle-thumb {
      position: absolute;
      width: 20px; height: 20px;
      background: var(--primary);
      border-radius: 50%;
      top: 3px; left: 4px;
      transition: transform 0.25s cubic-bezier(.4,0,.2,1), background 0.25s;
      box-shadow: 0 1px 4px rgba(0,0,0,0.3);
    }

    .theme-toggle input:checked ~ .toggle-thumb {
      transform: translateX(24px);
    }

    [data-theme="light"] .toggle-track {
      background: #e8edf8;
      border-color: #c8d0e8;
    }

    /* Summary */
    .summary-bar {
      background: var(--surface);
      border-bottom: 1px solid var(--border);
      padding: 12px 24px;
    }

    .summary-inner {
      max-width: 1200px; margin: 0 auto;
      display: flex; gap: 24px; flex-wrap: wrap; align-items: center;
    }

    .summary-card { display: flex; flex-direction: column; gap: 2px; }
    .summary-label { font-size: 11px; color: var(--text3); letter-spacing: 0.05em; }
    .summary-value { font-size: 20px; font-weight: 700; }
    .summary-value.up { color: var(--up); }
    .summary-value.ongoing { color: var(--ongoing); }
    .summary-value.new-clr { color: var(--new); }
    .summary-divider { width: 1px; background: var(--border); align-self: stretch; }

    /* Tabs */
    .tabs-wrap {
      max-width: 1200px; margin: 24px auto 0; padding: 0 24px;
    }

    .tabs {
      display: flex; gap: 4px;
      background: var(--surface); border-radius: 12px;
      padding: 4px; width: fit-content;
      border: 1px solid var(--border);
    }

    .tab {
      padding: 8px 20px; border-radius: 9px;
      font-size: 14px; font-weight: 600;
      cursor: pointer; transition: all 0.2s;
      color: var(--text2); border: none; background: none;
      display: flex; align-items: center; gap: 7px;
    }

    .tab .cnt {
      font-size: 11px; padding: 1px 7px; border-radius: 20px;
    }

    .tab.active { background: var(--primary); color: #fff; }
    .tab.active .cnt { background: rgba(255,255,255,0.2); color: #fff; }
    .tab:not(.active):hover { background: var(--surface2); color: var(--text); }
    .tab.t-ongoing .cnt { background: var(--badge-ongoing); color: var(--ongoing); }
    .tab.t-new .cnt { background: var(--badge-new); color: var(--new); }
    .tab.t-closed .cnt { background: var(--badge-closed); color: var(--closed); }

    /* Filter */
    .filter-bar {
      max-width: 1200px; margin: 16px auto 0; padding: 0 24px;
      display: flex; align-items: center; justify-content: space-between;
      flex-wrap: wrap; gap: 12px;
    }

    .filter-left { display: flex; align-items: center; gap: 8px; }

    .search-box {
      display: flex; align-items: center; gap: 8px;
      background: var(--surface); border: 1px solid var(--border);
      border-radius: 8px; padding: 7px 12px;
    }

    .search-box input {
      background: none; border: none; outline: none;
      color: var(--text); font-size: 13px; width: 160px;
    }

    .search-box input::placeholder { color: var(--text3); }

    .sort-select {
      background: var(--surface); border: 1px solid var(--border);
      border-radius: 8px; padding: 7px 10px;
      font-size: 13px; color: var(--text2); cursor: pointer; outline: none;
    }

    .filter-right { font-size: 12px; color: var(--text3); }

    /* Table */
    .table-wrap {
      max-width: 1200px; margin: 16px auto 60px; padding: 0 24px;
    }

    .ipo-table { width: 100%; border-collapse: collapse; }
    .ipo-table thead tr { border-bottom: 1px solid var(--border); }
    .ipo-table thead th {
      padding: 10px 16px; font-size: 11px; font-weight: 600;
      color: var(--text3); text-align: left; letter-spacing: 0.05em;
      text-transform: uppercase;
    }
    .ipo-table thead th.right { text-align: right; }
    .ipo-table tbody tr {
      border-bottom: 1px solid var(--border);
      transition: background 0.15s; cursor: pointer;
    }
    .ipo-table tbody tr:hover { background: var(--surface); }
    .ipo-table tbody tr:last-child { border-bottom: none; }
    .ipo-table tbody td { padding: 14px 16px; font-size: 13px; vertical-align: middle; }
    .ipo-table tbody td.right { text-align: right; }

    .company-cell { display: flex; align-items: center; gap: 12px; }
    .company-logo {
      width: 36px; height: 36px; border-radius: 8px;
      background: var(--surface2); border: 1px solid var(--border);
      display: flex; align-items: center; justify-content: center;
      font-size: 13px; font-weight: 700; color: var(--primary-light); flex-shrink: 0;
    }
    .company-name { font-size: 14px; font-weight: 600; }
    .company-sector { font-size: 11px; color: var(--text3); margin-top: 1px; }

    .status-badge {
      display: inline-flex; align-items: center; gap: 5px;
      padding: 3px 9px; border-radius: 20px;
      font-size: 11px; font-weight: 600;
    }
    .status-badge::before {
      content: ''; width: 5px; height: 5px; border-radius: 50%; background: currentColor;
    }
    .status-badge.ongoing { background: var(--badge-ongoing); color: var(--ongoing); }
    .status-badge.new { background: var(--badge-new); color: var(--new); }
    .status-badge.closed { background: var(--badge-closed); color: var(--closed); }
    .status-badge.ongoing::before { animation: pulse 1.5s infinite; }

    .rate-cell { min-width: 180px; }
    .rate-header { display: flex; justify-content: space-between; margin-bottom: 5px; }
    .rate-value { font-size: 15px; font-weight: 700; }
    .rate-value.hot { color: var(--up); }
    .rate-value.warm { color: var(--new); }
    .rate-value.cool { color: var(--down); }
    .rate-value.na { color: var(--text3); }

    .rate-bar-bg { height: 4px; background: var(--border); border-radius: 2px; }
    .rate-bar-fill { height: 100%; border-radius: 2px; transition: width 0.8s cubic-bezier(.4,0,.2,1); }
    .rate-bar-fill.hot { background: linear-gradient(90deg,#ff9090,var(--up)); }
    .rate-bar-fill.warm { background: linear-gradient(90deg,#f5c570,var(--new)); }
    .rate-bar-fill.cool { background: linear-gradient(90deg,#7dcfef,var(--down)); }
    .rate-bar-fill.na { background: var(--border); }

    .price-range { font-size: 12px; color: var(--text3); }
    .offer-price { font-size: 14px; font-weight: 600; }
    .date-range { font-size: 12px; color: var(--text2); white-space: nowrap; }
    .date-sub { font-size: 11px; color: var(--text3); margin-top: 2px; }

    .dday {
      display: inline-block; padding: 2px 8px;
      border-radius: 4px; font-size: 11px; font-weight: 700;
    }
    .dday.today { background: rgba(255,87,87,0.15); color: var(--up); }
    .dday.soon { background: rgba(91,106,240,0.15); color: var(--primary-light); }
    .dday.over { background: var(--badge-closed); color: var(--closed); }

    .exchange { font-size: 11px; padding: 2px 7px; border-radius: 4px; font-weight: 600; }
    .exchange.kospi { background: rgba(91,106,240,0.15); color: var(--primary-light); }
    .exchange.kosdaq { background: rgba(80,201,110,0.12); color: var(--ongoing); }

    .underwriter { font-size: 12px; color: var(--text2); }

    .tab-panel { display: none; }
    .tab-panel.active { display: block; }

    /* Loading */
    .loading-wrap {
      display: flex; flex-direction: column; align-items: center;
      justify-content: center; padding: 80px 0; gap: 16px;
    }

    .spinner {
      width: 36px; height: 36px; border-radius: 50%;
      border: 3px solid var(--border);
      border-top-color: var(--primary);
      animation: spin 0.8s linear infinite;
    }

    @keyframes spin { to { transform: rotate(360deg); } }

    .loading-text { font-size: 14px; color: var(--text3); }

    .empty-state { text-align: center; padding: 80px 0; color: var(--text3); }
    .empty-state .icon { font-size: 40px; margin-bottom: 12px; }
    .empty-state p { font-size: 14px; }

    /* ── 진행중 없을 때 빈 화면 ── */
    .no-ongoing {
      padding: 32px 0 48px;
    }

    /* 카운트다운 카드 (진행중 카드와 동일 구조) */
    .countdown-card {
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: 16px;
      overflow: hidden;
      position: relative;
      margin-bottom: 16px;
    }
    .countdown-card::before {
      content: '';
      position: absolute;
      top: 0; left: 0; right: 0;
      height: 3px;
      background: linear-gradient(90deg, var(--primary), var(--primary-light));
    }
    .countdown-glow {
      position: absolute;
      top: -60px; right: -60px;
      width: 200px; height: 200px;
      background: radial-gradient(circle, rgba(91,106,240,0.12) 0%, transparent 70%);
      pointer-events: none;
    }
    /* 헤더 */
    .cd-header {
      display: flex; align-items: center; gap: 12px;
      padding: 16px 18px 12px;
    }
    .cd-logo {
      width: 42px; height: 42px;
      background: linear-gradient(135deg, var(--primary), var(--primary-light));
      border-radius: 10px;
      display: flex; align-items: center; justify-content: center;
      font-size: 14px; font-weight: 800; color: #fff; flex-shrink: 0;
    }
    .cd-info { flex: 1; min-width: 0; }
    .cd-name { font-size: 16px; font-weight: 700; margin-bottom: 4px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
    .cd-badges { display: flex; align-items: center; gap: 6px; font-size: 12px; color: var(--text3); }
    .cd-soon-tag {
      padding: 4px 10px; border-radius: 20px; font-size: 12px; font-weight: 700;
      background: rgba(91,106,240,0.15); color: var(--primary-light);
      white-space: nowrap; flex-shrink: 0;
      animation: pulse-badge 2s infinite;
    }
    /* 2열 바디 */
    .cd-body {
      display: grid;
      grid-template-columns: 1fr 1fr;
      border-top: 1px solid var(--border);
    }
    /* 좌: 카운트다운 */
    .cd-timer-section {
      padding: 18px 18px 16px;
      background: var(--surface2);
      border-right: 1px solid var(--border);
      display: flex; flex-direction: column; justify-content: center;
    }
    .cd-timer-label {
      font-size: 11px; color: var(--text3); font-weight: 600;
      text-transform: uppercase; letter-spacing: 0.5px;
      margin-bottom: 14px;
      display: flex; align-items: center; gap: 6px;
    }
    .cd-timer-dot {
      width: 6px; height: 6px;
      background: var(--primary-light);
      border-radius: 50%;
      animation: pulse 2s infinite;
    }
    .cd-boxes {
      display: flex; gap: 8px; align-items: center;
    }
    .cd-box {
      display: flex; flex-direction: column; align-items: center;
      background: var(--surface); border: 1px solid var(--border);
      border-radius: 10px; padding: 10px 14px; min-width: 58px;
      flex: 1;
    }
    .cd-num {
      font-size: 26px; font-weight: 800;
      color: var(--text); line-height: 1;
      font-variant-numeric: tabular-nums;
      font-feature-settings: "tnum";
    }
    .cd-num.highlight { color: var(--primary-light); }
    .cd-label {
      font-size: 10px; color: var(--text3);
      margin-top: 4px; letter-spacing: 0.05em;
    }
    .cd-sep { font-size: 20px; font-weight: 700; color: var(--text3); flex-shrink: 0; }
    /* 우: 기본 정보 */
    .cd-stats-section {
      display: grid;
      grid-template-columns: 1fr 1px 1fr 1px 1fr;
      padding: 14px 18px;
      align-content: center;
    }
    /* 하단: detail 정보 */
    .cd-detail-section {
      border-top: 1px solid var(--border);
      padding: 14px 18px;
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 0;
    }
    .cd-detail-item {
      text-align: center; padding: 0 8px;
      border-right: 1px solid var(--border);
    }
    .cd-detail-item:last-child { border-right: none; }
    .cd-detail-label {
      font-size: 10px; color: var(--text3); text-transform: uppercase;
      letter-spacing: 0.4px; margin-bottom: 5px;
    }
    .cd-detail-value {
      font-size: 14px; font-weight: 700;
    }
    .cd-detail-sub { font-size: 10px; color: var(--text3); margin-top: 2px; }
    .cd-detail-loading { font-size: 12px; color: var(--text3); text-align: center; padding: 8px 0; }
    @media (max-width: 600px) {
      .cd-body { grid-template-columns: 1fr; }
      .cd-timer-section { border-right: none; border-bottom: 1px solid var(--border); }
      .cd-detail-section { grid-template-columns: 1fr 1px 1fr; }
      .cd-detail-item:last-child { display: none; }
    }

    .cd-sep {
      font-size: 28px; font-weight: 300; color: var(--border);
      align-self: center; padding-bottom: 4px;
    }

    /* 최근 마감 카드 */
    .recent-section-title {
      font-size: 13px; font-weight: 600; color: var(--text3);
      text-transform: uppercase; letter-spacing: 0.08em;
      margin-bottom: 14px;
      display: flex; align-items: center; gap: 8px;
    }

    .recent-section-title::after {
      content: '';
      flex: 1; height: 1px; background: var(--border);
    }

    .recent-cards {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(200px, 1fr));
      gap: 12px;
    }

    .recent-card {
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: 12px;
      padding: 16px;
      transition: border-color 0.2s, transform 0.2s;
      cursor: default;
    }

    .recent-card:hover {
      border-color: var(--primary);
      transform: translateY(-2px);
    }

    .rc-header {
      display: flex; align-items: center; justify-content: space-between;
      margin-bottom: 10px;
    }

    .rc-name {
      font-size: 13px; font-weight: 700;
      white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
      max-width: 120px;
    }

    .rc-rate {
      font-size: 18px; font-weight: 800; margin-bottom: 2px;
    }

    .rc-rate.hot { color: var(--up); }
    .rc-rate.warm { color: var(--new); }
    .rc-rate.cool { color: var(--down); }

    .rc-bar-bg {
      height: 3px; background: var(--border); border-radius: 2px; margin-bottom: 8px;
    }

    .rc-bar-fill {
      height: 100%; border-radius: 2px;
    }

    .rc-bar-fill.hot { background: linear-gradient(90deg,#ff9090,var(--up)); }
    .rc-bar-fill.warm { background: linear-gradient(90deg,#f5c570,var(--new)); }
    .rc-bar-fill.cool { background: linear-gradient(90deg,#7dcfef,var(--down)); }

      마감 <span class="cnt" id="cnt-closed">—</span>
    </button>

</div>

<div class="filter-bar">

<div class="table-wrap" id="errorBanner"></div>

<div class="table-wrap">

    <div class="loading-wrap"><div class="spinner"></div><p class="loading-text">데이터 불러오는 중...</p></div>

  </div>
  <div class="tab-panel" id="panel-closed">
    <div class="loading-wrap"><div class="spinner"></div><p class="loading-text">데이터 불러오는 중...</p></div>
  </div>

<!-- 항상 노출 하단 섹션 -->
<div class="bottom-sections">
  <div class="bottom-section-block" id="recentClosedBlock">
    <div class="bottom-section-header">
      <h2>최근 마감 인기 종목</h2>
    </div>
    <div class="recent-cards" id="recentCards">
      <div class="loading-wrap"><div class="spinner"></div></div>
    </div>
  </div>
  <div class="bottom-section-block" id="returnsBlock">
    <div class="bottom-section-header">
      <h2>공모가 대비 수익률</h2>
      <span class="section-live-tag">실시간</span>
    </div>
    <div class="returns-cards" id="returnsCards">
      <div class="loading-wrap"><div class="spinner"></div></div>
    </div>

<script>
const IS_LOCAL = location.hostname === 'localhost' || location.hostname === '127.0.0.1';
const API = IS_LOCAL ? '/api/ipos?mock=1' : '/api/ipos';
const REFRESH_MS = 3 * 60 * 1000; // 3분

// ── 최소 청약 증거금 계산 ────────────────────────────────────────────────────

function minDepositAmt(ipo) {
  // 확정 공모가 우선, 없으면 희망밴드 상단
  let price = ipo.price;
  if (!price && ipo.price_range) {
    const m = ipo.price_range.replace(/,/g, '').match(/(\d+)\s*$/);
    if (m) price = parseInt(m[1]);
  }
  if (!price) return null;
  return price * 10 * 0.5; // 10주 × 50% 증거금
}

function fmtMoney(n) {
  if (n === null || n === undefined) return null;
  if (n >= 10000000) return (n / 10000000).toFixed(0) + '천만원';
  if (n >= 100000)   return Math.round(n / 10000) + '만원';
  return n.toLocaleString() + '원';
}

function minDepositLabel(ipo) {
  const amt = minDepositAmt(ipo);
  if (!amt) return null;
  const base = ipo.price ? '' : '(희망밴드 상단 기준)';
  return fmtMoney(amt) + (base ? `<span style="font-size:10px;color:var(--text3)"> ${base}</span>` : '');
}

let allData = { ongoing: [], new: [], closed: [] };
let currentTab = 'ongoing';

// ── Helpers ──────────────────────────────────────────────────────────────────

function today() {
  return new Date().toISOString().slice(0, 10);
}

function fmtDate(iso) {
  if (!iso) return '—';
  const [, m, d] = iso.split('-');
  return `${+m}/${+d}`;
}

function dday(endIso) {
  if (!endIso) return null;
  const diff = Math.ceil((new Date(endIso) - new Date(today())) / 86400000);
  if (diff === 0) return { label: 'D-Day', cls: 'today' };
  if (diff > 0)  return { label: `D-${diff}`, cls: 'soon' };
  return null;
}

function rateClass(rate) {
  if (!rate) return 'na';
  if (rate >= 500) return 'hot';
  if (rate >= 100) return 'warm';
  return 'cool';
}

function barWidth(rate) {
  if (!rate) return 0;
  return Math.min(100, (Math.log10(rate + 1) / Math.log10(4001)) * 100);
}

function abbr(name) {
  return name.replace(/[^가-힣a-zA-Z0-9]/g, '').slice(0, 2).toUpperCase();
}

function escHtml(s) {
  if (!s) return '';
  return s.replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;');
}

// ── Render ────────────────────────────────────────────────────────────────────

function statusBadge(s) {
  const m = { ongoing: ['진행중', 'ongoing'], new: ['예정', 'new'], closed: ['마감', 'closed'] };
  const [label, cls] = m[s] || ['—', 'closed'];
  return `<span class="status-badge ${cls}">${escHtml(label)}</span>`;
}

function exchangeBadge(market) {
  return market === 'kospi'
    ? `<span class="exchange kospi">KOSPI</span>`
    : `<span class="exchange kosdaq">KOSDAQ</span>`;
}

function rateCell(rate, endIso, showDday) {
  const rc = rateClass(rate);
  const bw = barWidth(rate);
  const rateLabel = rate ? `${rate.toLocaleString()}:1` : '청약 전';
  const ddayEl = showDday && endIso ? (() => {
    const dd = dday(endIso);
    return dd ? `<span class="dday ${dd.cls}">${dd.label}</span>` : '';
  })() : '';

  return `<td class="rate-cell">
    <div class="rate-header">
      <span class="rate-value ${rc}">${escHtml(rateLabel)}</span>
      ${ddayEl}
    </div>
    <div class="rate-bar-bg"><div class="rate-bar-fill ${rc}" style="width:${bw}%"></div></div>
  </td>`;
}

function buildOngoingEmpty() {
  const next = allData.new[0];
  if (!next) {
    return `<div class="no-ongoing" style="text-align:center;padding:48px 0;color:var(--text3);font-size:14px">현재 진행 중인 공모주가 없습니다.</div>`;
  }
  const startMs = new Date(next.date_start + 'T09:00:00');
  setTimeout(() => startCountdown(startMs), 0);
  setTimeout(() => loadCountdownDetail(next), 0);

  const dep = minDepositAmt(next);
  const daysUntil = Math.ceil((startMs - Date.now()) / 86400000);
  const soonLabel = daysUntil <= 1 ? 'D-DAY' : `D-${daysUntil}`;

  return `
    <div class="no-ongoing">
      <div class="countdown-card">
        <div class="countdown-glow"></div>
        <div class="cd-header">
          <div class="cd-logo">${escHtml(abbr(next.name))}</div>
          <div class="cd-info">
            <div class="cd-name">${escHtml(next.name)}</div>
            <div class="cd-badges">
              ${exchangeBadge(next.market)}
              ${next.underwriter ? `<span>${escHtml(next.underwriter)}</span>` : ''}
            </div>
          </div>
          <div class="cd-soon-tag">${escHtml(soonLabel)}</div>
        </div>

        <div class="cd-body">
          <div class="cd-timer-section">
            <div class="cd-timer-label">
              <span class="cd-timer-dot"></span>
              청약 시작까지
            </div>
            <div class="cd-boxes" id="cdBoxes">
              <div class="cd-box"><span class="cd-num highlight" id="cd-d">--</span><span class="cd-label">일</span></div>
              <span class="cd-sep">:</span>
              <div class="cd-box"><span class="cd-num" id="cd-h">--</span><span class="cd-label">시간</span></div>
              <span class="cd-sep">:</span>
              <div class="cd-box"><span class="cd-num" id="cd-m">--</span><span class="cd-label">분</span></div>
              <span class="cd-sep">:</span>
              <div class="cd-box"><span class="cd-num" id="cd-s">--</span><span class="cd-label">초</span></div>
            </div>
          </div>

          <div class="cd-stats-section">
            <div class="icard-stat">
              <div class="icard-stat-label">희망 공모가</div>
              <div class="icard-stat-value" style="font-size:12px">${escHtml(next.price_range || '미확정')}</div>
              <div class="icard-stat-sub">희망가 범위</div>
            </div>
            <div class="icard-vdivider"></div>
            <div class="icard-stat">
              <div class="icard-stat-label">최소 증거금</div>
              <div class="icard-stat-value green">${dep ? fmtMoney(dep) : '미확정'}</div>
              <div class="icard-stat-sub">10주 · 50%</div>
            </div>
            <div class="icard-vdivider"></div>
            <div class="icard-stat">
              <div class="icard-stat-label">청약 기간</div>
              <div class="icard-stat-value" style="font-size:12px">${fmtDate(next.date_start)} ~ ${fmtDate(next.date_end)}</div>
              <div class="icard-stat-sub">${escHtml(next.underwriter || '—')}</div>
            </div>
          </div>
        </div>

        <div class="cd-detail-section" id="cd-detail-body">
          <div class="cd-detail-loading" style="grid-column:1/-1">수요예측 결과 불러오는 중...</div>
        </div>
      </div>
    </div>`;
}

function loadCountdownDetail(next) {
  if (!next.no) return;
  const el = document.getElementById('cd-detail-body');
  if (!el) return;
  fetch(`/api/ipos/${next.no}/detail`)
    .then(r => r.json())
    .then(detail => {
      const inst = detail.institutional || '—';
      const lockup = detail.lockup || '—';
      const listing = detail.listing_date || '—';
      el.innerHTML = `
        <div class="cd-detail-item">
          <div class="cd-detail-label">기관 경쟁률</div>
          <div class="cd-detail-value" style="color:var(--primary-light)">${escHtml(inst)}</div>
          <div class="cd-detail-sub">수요예측 결과</div>
        </div>
        <div class="cd-detail-item">
          <div class="cd-detail-label">의무보유확약</div>
          <div class="cd-detail-value" style="color:var(--ongoing)">${escHtml(lockup)}</div>
          <div class="cd-detail-sub">기관 확약 비율</div>
        </div>
        <div class="cd-detail-item">
          <div class="cd-detail-label">상장 예정일</div>
          <div class="cd-detail-value">${escHtml(listing)}</div>
          <div class="cd-detail-sub">코스닥 상장</div>
        </div>`;
    })
    .catch(() => { if (el) el.innerHTML = '<div class="cd-detail-loading" style="grid-column:1/-1">수요예측 정보 없음</div>'; });
}

function buildOngoingCards(data) {
  if (!data.length) return buildOngoingEmpty();

  const single = data.length === 1;

  return `<div class="ongoing-cards${single ? ' single' : ''}">
    ${data.map(d => {
      const rc = rateClass(d.rate);
      const bw = barWidth(d.rate);
      const dep = minDepositAmt(d);
      const dd = d.date_end ? dday(d.date_end) : null;
      const ddLabel = dd ? dd.label : '';
      const ddUrgent = d.date_end && dday(d.date_end)?.n <= 1 ? ' urgent' : '';
      const accentMap = { up: 'var(--up)', primary: 'var(--primary)', down: 'var(--down)' };
      const accent = accentMap[rc] || 'var(--primary)';
      const cardId = 'card-' + (d.no || d.name.replace(/\s/g,''));

      const rateSection = `
        <div class="icard-rate-section">
          <div class="icard-rate-header">
            <span class="icard-rate-label">
              <span class="icard-live-dot"></span>
              실시간 청약 경쟁률
            </span>
          </div>
          <div class="icard-rate-value ${rc}">
            ${d.rate ? d.rate.toLocaleString() + ':1' : '집계 중...'}
          </div>
          <div class="icard-bar-wrap">
            <div class="icard-bar-bg">
              <div class="icard-bar-fill ${rc}" style="width:${bw}%"></div>
            </div>
          </div>
          <div class="icard-rate-end">마감 ${escHtml(d.date_end || '—')}</div>
        </div>`;

      const footerSection = `
        <div class="icard-footer">
          <div class="icard-stat">
            <div class="icard-stat-label">공모가</div>
            <div class="icard-stat-value">${d.price ? d.price.toLocaleString()+'원' : '미확정'}</div>
            <div class="icard-stat-sub">${escHtml(d.price_range || '—')}</div>
          </div>
          <div class="icard-vdivider"></div>
          <div class="icard-stat">
            <div class="icard-stat-label">최소 증거금</div>
            <div class="icard-stat-value green">${dep ? fmtMoney(dep) : '—'}</div>
            <div class="icard-stat-sub">10주 · 50%</div>
          </div>
          <div class="icard-vdivider"></div>
          <div class="icard-stat">
            <div class="icard-stat-label">청약 기간</div>
            <div class="icard-stat-value" style="font-size:12px">${fmtDate(d.date_start)} ~ ${fmtDate(d.date_end)}</div>
            <div class="icard-stat-sub">${escHtml(d.underwriter || '—')}</div>
          </div>
        </div>`;

      const detailSection = `
        <div class="cd-detail-section" id="${cardId}-detail">
          <div class="cd-detail-loading" style="grid-column:1/-1">수요예측 정보 불러오는 중...</div>
        </div>`;

      const equalSection = single ? `
        <div class="icard-equal-section" id="${cardId}-equal">
          <div class="icard-equal-title">
            <span class="icard-live-dot"></span>
            균등 배정 예상 수량 (청약자 수별)
          </div>
          <div class="icard-equal-loading" id="${cardId}-equal-body">데이터 불러오는 중...</div>
        </div>` : '';

      const bodyHtml = single
        ? `<div class="icard-body">${rateSection}<div class="icard-right">${footerSection}</div></div>${detailSection}${equalSection}`
        : `${rateSection}${footerSection}${detailSection}`;

      return `<div class="ipo-card" id="${cardId}" style="--card-accent:${accent}" onclick='openModal(${JSON.stringify(d).replace(/'/g,"&#39;")})'>
        <div class="icard-header">
          <div class="icard-logo">${escHtml(abbr(d.name))}</div>
          <div class="icard-info">
            <div class="icard-name">${escHtml(d.name)}</div>
            <div class="icard-badges">
              ${exchangeBadge(d.market)}
              ${d.underwriter ? `<span>${escHtml(d.underwriter)}</span>` : ''}
            </div>
          </div>
          ${ddLabel ? `<div class="icard-dday${ddUrgent}">${escHtml(ddLabel)}</div>` : ''}
        </div>
        ${bodyHtml}
      </div>`;
    }).join('')}
  </div>`;
}

function loadEqualSection(d) {
  if (!d.no) return;
  const cardId = 'card-' + (d.no || d.name.replace(/\s/g,''));

  fetch(`/api/ipos/${d.no}/detail`)
    .then(r => r.json())
    .then(detail => {
      // ── 기관경쟁률 · 의무보유확약 · 상장예정일 ──
      const detailEl = document.getElementById(cardId + '-detail');
      if (detailEl) {
        const inst    = detail.institutional || '—';
        const lockup  = detail.lockup        || '—';
        const listing = detail.listing_date  || '—';
        const market  = d.market === 'kospi' ? '코스피' : '코스닥';
        detailEl.innerHTML = `
          <div class="cd-detail-item">
            <div class="cd-detail-label">기관 경쟁률</div>
            <div class="cd-detail-value" style="color:var(--primary-light)">${escHtml(inst)}</div>
            <div class="cd-detail-sub">수요예측 결과</div>
          </div>
          <div class="cd-detail-item">
            <div class="cd-detail-label">의무보유확약</div>
            <div class="cd-detail-value" style="color:var(--ongoing)">${escHtml(lockup)}</div>
            <div class="cd-detail-sub">기관 확약 비율</div>
          </div>
          <div class="cd-detail-item">
            <div class="cd-detail-label">상장 예정일</div>
            <div class="cd-detail-value">${escHtml(listing)}</div>
            <div class="cd-detail-sub">${market} 상장</div>
          </div>`;
      }

      // ── 균등 배정 예상 (single 카드만) ──
      const bodyEl = document.getElementById(cardId + '-equal-body');
      if (!bodyEl) return;
      const gs = detail.general_shares;
      if (!gs) { bodyEl.textContent = '배정 정보 없음'; return; }
      const equalPool = Math.floor(gs * 0.5);
      const scenarios = [
        { label: '1만명', n: 10000 },
        { label: '3만명', n: 30000 },
        { label: '10만명', n: 100000 },
        { label: '30만명', n: 300000 },
      ];
      bodyEl.outerHTML = `<div class="icard-equal-grid" id="${cardId}-equal-body">
        ${scenarios.map(s => {
          const shares = Math.floor(equalPool / s.n);
          const cls = shares >= 2 ? 'high' : shares === 1 ? '' : 'low';
          return `<div class="icard-equal-item">
            <div class="icard-equal-applicants">${s.label} 참여시</div>
            <div class="icard-equal-shares ${cls}">${shares > 0 ? shares + '주' : '미배정'}</div>
          </div>`;
        }).join('')}
      </div>`;
    })
    .catch(() => {
      const detailEl = document.getElementById(cardId + '-detail');
      if (detailEl) detailEl.innerHTML = '<div class="cd-detail-loading" style="grid-column:1/-1">수요예측 정보 없음</div>';
    });
}

let cdTimer = null;
let returnsLoaded = false;

function loadRecentCards() {
  const el = document.getElementById('recentCards');
  if (!el) return;
  const top5 = [...allData.closed].sort((a, b) => (b.rate||0)-(a.rate||0)).slice(0, 5);
  if (!top5.length) {
    document.getElementById('recentClosedBlock').style.display = 'none';
    return;
  }
  document.getElementById('recentClosedBlock').style.display = '';
  el.innerHTML = top5.map(d => {
    const rc = rateClass(d.rate);
    const bw = barWidth(d.rate);
    return `<div class="recent-card" onclick='openModal(${JSON.stringify(d).replace(/'/g,"&#39;")})'>
      <div class="rc-header">
        <div class="rc-name">${escHtml(d.name)}</div>
        ${exchangeBadge(d.market)}
      </div>
      <div class="rc-rate ${rc}">${d.rate ? d.rate.toLocaleString()+':1' : '—'}</div>
      <div class="rc-bar-bg"><div class="rc-bar-fill ${rc}" style="width:${bw}%"></div></div>
      <div class="rc-meta">${fmtDate(d.date_start)} ~ ${fmtDate(d.date_end)}</div>
      <div class="rc-price">${d.price ? d.price.toLocaleString()+'원' : '—'} · ${escHtml(d.underwriter||'—')}</div>
    </div>`;
  }).join('');
}

async function loadReturnsSection() {
  if (returnsLoaded) return;

  const el = document.getElementById('returnsCards');
  if (!el) return;

  // 스켈레톤
  el.innerHTML = `<table class="ret-table"><tbody>
    ${Array(6).fill(0).map(() => `<tr class="skel-row">
      <td><div class="skel-line" style="height:14px;width:140px"></div></td>
      <td><div class="skel-line" style="height:14px;width:60px"></div></td>
      <td><div class="skel-line" style="height:14px;width:80px"></div></td>
      <td><div class="skel-line" style="height:14px;width:80px"></div></td>
      <td><div class="skel-line" style="height:14px;width:70px"></div></td>
      <td><div class="skel-line" style="height:14px;width:90px"></div></td>
    </tr>`).join('')}
  </tbody></table>`;

  try {
    const res = await fetch('/api/ipos/returns');
    const data = await res.json();
    returnsLoaded = true;
    renderReturnsTable(data);
  } catch(e) {
    el.innerHTML = `<p style="color:var(--text3);font-size:13px;padding:16px 0">수익률 데이터를 불러오지 못했습니다.</p>`;
  }
}

function renderReturnsTable(items) {
  const el = document.getElementById('returnsCards');
  if (!el) return;
  if (!items || !items.length) {
    el.innerHTML = `<p style="color:var(--text3);font-size:13px;padding:16px 0">수익률 데이터가 없습니다.</p>`;
    return;
  }

  const rows = items.map(d => {
    const pct = d.return_pct;
    const cls = pct === null ? 'flat' : pct > 0 ? 'profit' : pct < 0 ? 'loss' : 'flat';
    const arrow = pct === null ? '—' : pct > 0 ? '▲' : pct < 0 ? '▼' : '—';
    const pctLabel = pct !== null ? `${arrow} ${Math.abs(pct).toFixed(2)}%` : '상장 전';
    const currentLabel = d.current_price ? d.current_price.toLocaleString() + '원' : '—';
    const offerLabel   = d.offer_price   ? d.offer_price.toLocaleString() + '원'   : '—';
    const ipo = [...allData.closed, ...allData.ongoing].find(x => x.no === d.no) || { ...d, status: 'closed' };

    return `<tr onclick='openModal(${JSON.stringify(ipo).replace(/'/g,"&#39;")})'>
      <td>
        <div class="company-cell">
          <div class="company-logo">${escHtml(abbr(d.name))}</div>
          <div>
            <div class="company-name">${escHtml(d.name)}</div>
            <div class="company-sector">${exchangeBadge(d.market)}</div>
          </div>
        </div>
      </td>
      <td><span class="status-badge closed">마감</span></td>

function startCountdown(targetMs) {
  if (cdTimer) clearInterval(cdTimer);
  function tick() {
    const diff = targetMs - Date.now();
    if (diff <= 0) { clearInterval(cdTimer); return; }
    const d = Math.floor(diff / 86400000);
    const h = Math.floor((diff % 86400000) / 3600000);
    const m = Math.floor((diff % 3600000) / 60000);
    const s = Math.floor((diff % 60000) / 1000);
    const el = (id, v) => { const e = document.getElementById(id); if(e) e.textContent = String(v).padStart(2,'0'); };
    el('cd-d', d); el('cd-h', h); el('cd-m', m); el('cd-s', s);
  }
  tick();
  cdTimer = setInterval(tick, 1000);
}

// ── Filter / Sort ─────────────────────────────────────────────────────────────

function filtered(dataset) {
  const q = document.getElementById('searchInput').value.trim().toLowerCase();
  const sort = document.getElementById('sortSelect').value;

  let data = [...dataset];
  if (q) {
    data = data.filter(d =>
      d.name.toLowerCase().includes(q) ||
      (d.underwriter || '').toLowerCase().includes(q)
    );
  }

  if (sort === 'rate') data.sort((a, b) => (b.rate || 0) - (a.rate || 0));
  else if (sort === 'date_asc') data.sort((a, b) => (a.date_end || '').localeCompare(b.date_end || ''));
  else if (sort === 'date_desc') data.sort((a, b) => (b.date_end || '').localeCompare(a.date_end || ''));
  else data.sort((a, b) => a.name.localeCompare(b.name));

  return data;
}

function render() {
  const og = filtered(allData.ongoing);
  const nw = filtered(allData.new);
  const cl = filtered(allData.closed);

  // Panels
  const ongoingThs = [
    {label:'종목명'},{label:'상태'},{label:'청약률'},
    {label:'공모가',right:true},{label:'청약 일정'},{label:'주간사'}
  ];
  const newThs = [
    {label:'종목명'},{label:'상태'},{label:'희망공모가'},
    {label:'청약 일정'},{label:'주간사'}
  ];
  const closedThs = [
    {label:'종목명'},{label:'상태'},{label:'최종 청약률'},
    {label:'공모가',right:true},{label:'청약 일정'},{label:'주간사'}
  ];

  const panelOg = document.getElementById('panel-ongoing');
  panelOg.innerHTML = buildOngoingCards(og);
  og.forEach(d => loadEqualSection(d));

  const panelNw = document.getElementById('panel-new');
  if (!panelNw.querySelector('table')) panelNw.innerHTML = tableShell(newThs, 'tbody-new');
  document.getElementById('tbody-new').innerHTML = buildNewRows(nw);

  const panelCl = document.getElementById('panel-closed');
  if (!panelCl.querySelector('table')) panelCl.innerHTML = tableShell(closedThs, 'tbody-closed');
  document.getElementById('tbody-closed').innerHTML = buildClosedRows(cl);

  // Counts
  document.getElementById('cnt-ongoing').textContent = allData.ongoing.length;
  document.getElementById('cnt-new').textContent = allData.new.length;
  document.getElementById('cnt-closed').textContent = allData.closed.length;

  // Summary stats
  const rates = [...allData.ongoing, ...allData.closed].filter(d => d.rate).map(d => d.rate);
  document.getElementById('sumOngoing').textContent = allData.ongoing.length;
  document.getElementById('sumNew').textContent = allData.new.length;
  document.getElementById('sumClosed').textContent = allData.closed.length;
  if (rates.length) {
    const top = Math.max(...rates);
    const avg = rates.reduce((a, b) => a + b, 0) / rates.length;
    document.getElementById('sumTop').textContent = top.toLocaleString() + ':1';
    document.getElementById('sumAvg').textContent = avg.toFixed(0) + ':1';
  }

  const currentCount = currentTab === 'ongoing' ? og.length : currentTab === 'new' ? nw.length : cl.length;
  document.getElementById('resultCount').textContent = `${currentCount}개 종목`;

  // 하단 섹션 항상 로드
  loadRecentCards();
  loadReturnsSection();
}

async function fetchData() {
  try {
    const res = await fetch(API);
    if (!res.ok) throw new Error(`HTTP ${res.status}`);
    const data = await res.json();
    allData.ongoing = data.ongoing || [];
    allData.new = data.new || [];
    allData.closed = data.closed || [];

    document.getElementById('updateTime').textContent =
      `업데이트: ${data.updated_at ? data.updated_at.slice(11,19) : '—'}`;
    document.getElementById('errorBanner').innerHTML = '';
    render();
  } catch (e) {
    document.getElementById('updateTime').textContent = '업데이트 실패';
    document.getElementById('errorBanner').innerHTML =
      `<div class="error-banner">⚠️ 데이터를 불러오지 못했습니다: ${escHtml(e.message)}</div>`;
  }
}

function applyFilters() { render(); }

function switchTab(tab) {
  currentTab = tab;
  document.querySelectorAll('.tab').forEach(t => t.classList.remove('active'));
  document.querySelectorAll('.tab-panel').forEach(p => p.classList.remove('active'));
  document.querySelector(`.t-${tab}`).classList.add('active');
  document.getElementById(`panel-${tab}`).classList.add('active');
  render();
}

function toggleTheme(checkbox) {
  const theme = checkbox.checked ? 'light' : 'dark';
  document.documentElement.setAttribute('data-theme', theme === 'light' ? 'light' : '');
  localStorage.setItem('theme', theme);
}

function initTheme() {
  const saved = localStorage.getItem('theme') || 'dark';
  const toggle = document.getElementById('themeToggle');
  if (saved === 'light') {
    document.documentElement.setAttribute('data-theme', 'light');
    toggle.checked = true;
  }
}
